        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Enable pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d studyabroad_application_analysis -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Apply migrations to database
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_application_analysis?schema=public

      # First build of shared package: needed by prisma seed script which imports
      # from @study-abroad/shared/dist/utils via require() (CJS resolution).
      - name: Build shared package (initial — for seed script)
        run: pnpm --filter @study-abroad/shared build

      # Seed DB BEFORE gold:fixtures so runSnapshot can look up testingPolicy
      # (and other school fields) from real seeded School rows. If DB is empty
      # the analysis service defaults every policy to UNKNOWN, leaving the
      # regenerated fixture file with no real BLIND/OPTIONAL/REQUIRED data.
      - name: Seed database
        run: pnpm --filter api exec prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_application_analysis?schema=public

      - name: Seed governance fixtures
        run: pnpm --filter api exec ts-node --transpile-only scripts/seed-application-analysis-governance.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_application_analysis?schema=public

      - name: Generate render fixtures
        run: pnpm --filter api gold:fixtures
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_application_analysis?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-e2e-testing
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d

      # Re-build shared AFTER gold:fixtures so the dist/ output includes the
      # regenerated fixture data. Otherwise Next.js (web app) resolves
      # @study-abroad/shared to the fresh .ts source via package.json `import`
      # field while Playwright's raw-Node ESM loader can't read .ts and falls
      # back to the stale dist/*.js — both sides see different fixture data
      # and the data-policy DOM comparison fails (Expected BLIND from dist
      # vs Received UNKNOWN from source).
      - name: Re-build shared package (after fixture regen)
        run: pnpm --filter @study-abroad/shared build

      - name: Run governance gate
        run: pnpm application-analysis:governance -- --mode=pr
        env:
          CI: true
          ENABLE_E2E_FIXTURES: true
          NEXT_PUBLIC_API_URL: http://localhost:4101
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_application_analysis?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-e2e-testing
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d

      - name: Upload governance artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: application-analysis-governance
          path: |
            apps/api/gold-cases/reports/
            e2e-report/
          retention-days: 7

  prediction-gate:
    name: Prediction Gate
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: studyabroad_prediction_gate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Enable pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d studyabroad_prediction_gate -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Apply migrations to prediction gate database
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      - name: Build shared package
        run: pnpm --filter @study-abroad/shared build

      - name: Build API
        run: pnpm --filter api build

      - name: Seed prediction gate database
        run: pnpm --filter api exec prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      # Closure-v2 prediction-input overlay. Mirrors migrate.sh step 1 in prod:
      # applies prediction-closure-latest.json (regenerated from prod via
      # build-prediction-closure-payload.ts) on top of the static catalog so
      # closure corrections (acceptanceRate, gpaDistribution, hasEarlyAction,
      # hasEarlyDecision2, etc.) actually reach CI. Without this step, every
      # closure correction silently diverges between prod and CI and Layer 3
      # regression fixtures flip pass/fail along the drift.
      - name: Apply prediction-closure overlay
        working-directory: apps/api
        run: pnpm exec tsx prisma/seeds/seed-prediction-closure.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      # Backfill hasEarlyAction / hasEarlyDecision2 booleans. Mirrors
      # migrate.sh step 15 — these columns were added in PR #295 but the
      # closure payload only carries them for schools that explicitly recorded
      # a value, so the static fallback list is still needed for full coverage.
      - name: Backfill EA / ED2 booleans
        working-directory: apps/api
        run: pnpm exec tsx prisma/seeds/backfill-has-ea-ed2.ts --apply
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      # Data-integrity corrections. MUST run after the closure overlay (which
      # re-applies raw values), mirroring migrate.sh's last steps, so the gate DB
      # matches prod and the audit below verifies the whole pipeline stayed clean.
      #   • intl/round — null only SCALE errors (intl <1% / >100%, early-round
      #     <1%). Intl >= overall is KEPT (verified real revenue-public rates), so
      #     calibration is unaffected.
      #   • audit/instate — set REAL verified rates: the audit anchors (e.g. CU
      #     Boulder 18.47%→80.5%) and per-school inStateAcceptanceRate. These run
      #     inside seed.ts too, but the overlay above RE-OVERRIDES them with raw
      #     payload values, so they MUST be re-applied here to win — exactly as
      #     migrate.sh step 17 does in prod. Order mirrors seed.ts
      #     (intl→round→audit→instate).
      - name: Apply data-integrity corrections
        working-directory: apps/api
        run: |
          pnpm exec tsx prisma/seed-intl-rate-correction.ts
          pnpm exec tsx prisma/seed-round-rate-correction.ts
          pnpm exec tsx prisma/seed-audit-corrections-2026-05-31.ts
          pnpm exec tsx prisma/seed-instate-rate-2026-05-31.ts
          pnpm exec tsx prisma/seed-testing-policy-2026-07-25.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      # Property sweep over the full seeded population: monotonicity, dominance,
      # round ordering, hook direction, determinism, clamp bounds. It is the only
      # instrument that catches "a change pushed predictions too high" — gold and
      # calibration cases pin specific points, this pins the shape.
      #
      # Tier-1 CDS admit bands. This job used to skip them, so the gate DB had
      # zero cdsAdmitBands while prod loads them at migrate.sh step 54 — the
      # whole Tier-1 anchor path went unexercised here. Seeding them closes that
      # gap and is what lets the sweep below actually cover it.
      - name: Load CDS admit bands
        working-directory: apps/api
        run: pnpm exec tsx prisma/seeds/load-cds-bands.ts --file prisma/seeds/data/cds-admit-bands.json --apply
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      # Property sweep over the full seeded population: monotonicity, dominance,
      # round ordering, hook direction, determinism, clamp bounds. It is the only
      # instrument that catches "a change pushed predictions too high" — gold and
      # calibration cases pin specific points, this pins the shape.
      #
      # It was excluded for years on the grounds that a partially-seeded gate DB
      # produces tier-crossing artifacts. That was true, and the cause was not
      # the gate: prisma/seeds/data/cds-admit-bands.json was merging a starter
      # FIXTURE that gave UC Merced only a `3.75-4.00` rung, so a 4.0 anchored
      # at 0.88 while a 3.5 fell through to Tier-2 and anchored at ~0.89. Prod
      # loaded that same file. Fixture removed 2026-07-25; measured on a
      # faithful reproduction of this job's DB, with bands loaded: 241 schools,
      # 9,342 checks, 0 violations, all 16 invariants green.
      - name: Counselor invariant sweep
        run: pnpm --filter api invariants:counselor
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      - name: Verify prediction launch reports
        run: |
          pnpm --filter api verify:counselor-coverage
          pnpm --filter api verify:counselor-data-quality
          pnpm --filter api verify:prediction-launch
          pnpm --filter api verify:profile-signal-coverage
          pnpm --filter api audit:counselor-vs-cases
          pnpm --filter api audit:prediction-data-integrity
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-prediction-gate
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci-prediction-gate
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d

      - name: Upload prediction launch reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prediction-launch-reports
          path: |
            verification-report/launch/
            verification-report/profile-signals/
          retention-days: 14

      - name: Start API server
        run: |
          pnpm --filter api start:prod > /tmp/prediction-gate-api.log 2>&1 &
          echo $! > /tmp/prediction-gate-api.pid
        env:
          NODE_ENV: test
          PORT: 4101
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-prediction-gate
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci-prediction-gate
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d

      - name: Wait for API readiness
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:4101/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/prediction-gate-api.log || true
          exit 1

      - name: Run counselor gold cases
        # Cold-start counselor engine regression gate (PR-3). Loads 30 hand-curated
        # (profile, school, expectedRange) cases from apps/api/gold-cases/counselor/
        # and asserts no counselor prediction drifts outside its expected band.
        # Runs BEFORE the existing accuracy/smoke check so a math regression in
        # the modifiers fails fast, before the heavier seeded HTTP smoke.
        working-directory: apps/api
        run: pnpm gold:counselor
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      - name: Upload counselor gold case report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: counselor-gold-case-report
          path: apps/api/gold-cases/counselor/reports/
          retention-days: 14

      - name: Run counselor calibration spec (Layer 3)
        # Industry-anchored calibration check. Each fixture has an expected
        # probability band derived from NACAC / Crimson / CDS (NOT from current
        # engine math). Fails fast if the engine drifts away from industry
        # intuition. See docs/PREDICTION_CALIBRATION_METHODOLOGY.md.
        working-directory: apps/api
        run: pnpm calibration:counselor
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      - name: Upload counselor calibration spec report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: counselor-calibration-spec-report
          path: apps/api/gold-cases/counselor-calibration/reports/
          retention-days: 14

      # NOTE: the counselor invariant sweep (`pnpm invariants:counselor`) is intentionally
      # NOT gated here. It is a full-POPULATION property sweep and is only meaningful on a
      # prod-representative dataset (complete CDS band ladders + gpaDistribution). This gate
      # DB is seeded via `prisma db seed` (minimal/partial: no full bands), which produces
      # tier-crossing artifacts (a 3.8 matching a lone low Tier-1 band scores below a 3.5 on
      # the Tier-2 overall) that do NOT exist on the orchestrator-seeded prod path. Run it
      # LOCALLY against `pnpm --filter api db:seed` instead — see the script header and
      # docs/PREDICTION_INVARIANT_DEEPDIVE_2026-06-01.md.

      - name: Run prediction gate
        run: pnpm exec tsx scripts/prediction-gate.ts --days 365 --min-verified 200 --school-query Wisconsin --round EA --base-url http://localhost:4101/api/v1
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      - name: Upload prediction gate API log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prediction-gate-api-log
          path: /tmp/prediction-gate-api.log
          retention-days: 7

      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/prediction-gate-api.pid ]; then
            kill "$(cat /tmp/prediction-gate-api.pid)" || true
          fi

  # ── Documentation Check ───────────────────────────────────
  doc-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check API docs sync
        run: |
          CHANGED_CONTROLLERS=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- 'apps/api/src/modules/**/*.controller.ts' | wc -l | tr -d ' ')
          if [ "$CHANGED_CONTROLLERS" -gt "0" ]; then
            API_DOC_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- 'docs/API_REFERENCE.md' | wc -l | tr -d ' ')
            if [ "$API_DOC_CHANGED" -eq "0" ]; then
              echo "::warning::Controller files were modified but docs/API_REFERENCE.md was not updated. Please verify the API reference is still accurate."
            fi
          fi

      - name: Check schema docs sync
        run: |
          SCHEMA_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- 'apps/api/prisma/schema.prisma' | wc -l | tr -d ' ')
          if [ "$SCHEMA_CHANGED" -gt "0" ]; then
            ARCH_DOC_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- 'docs/ARCHITECTURE.md' | wc -l | tr -d ' ')
            if [ "$ARCH_DOC_CHANGED" -eq "0" ]; then
              echo "::warning::Schema was modified but docs/ARCHITECTURE.md was not updated. Please verify the architecture doc is still accurate."
            fi
          fi

      - name: Verify doc links
        run: node scripts/ci/check-doc-links.mjs

  # ── Secret Scan ───────────────────────────────────────────
  # Uses the OSS gitleaks binary directly (rather than gitleaks-action@v2)
  # because the official action now requires a paid license for org repos
  # ("🛑 missing gitleaks license. Go grab one at gitleaks.io"). The binary
  # itself remains free under MIT; we just need to run it ourselves.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (OSS)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repo for secrets
        # `--redact` masks any matched secret value in the log so the report
        # itself can't leak. Non-zero exit means findings present → CI fails.
        #
        # `--log-opts HEAD` is load-bearing: gitleaks defaults to `git log --all`,
        # and `fetch-depth: 0` above fetches every branch, so without it the scan
        # covers refs that have nothing to do with this commit — one unmerged
        # branch's test fixture turns every other PR red. HEAD limits it to this
        # commit's own ancestry, which is exactly what can reach main. Verified
        # both ways on gitleaks 8.18.4: a leak on a sibling branch stops being
        # reported, a leak in HEAD's own history still is.
        run: gitleaks detect --source . --log-opts HEAD --redact --verbose --no-banner

  # ── SAST Scan ─────────────────────────────────────────────
  sast:
    name: SAST Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b \
            semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

  # ── Security Scan ─────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master 2026-08-25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          skip-dirs: 'node_modules,.next,dist,coverage'

  # ── Build ─────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo Cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Build API
        run: pnpm --filter api build

      - name: Build Web
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL || 'http://localhost:4101' }}

      # 2026-05 Phase 4 #37: bundle-size budget gate.
      # Compares post-build app-build-manifest.json against the committed
      # baseline at apps/web/.bundle-baseline.json. Fails when any route
      # grows by more than thresholdPct (default 5%).
      # Until the baseline is seeded, runs in informational mode (prints
      # top-10 route sizes, never fails).
      - name: Bundle size budget
        run: pnpm lint:bundle

      - name: Type check Mobile
        run: pnpm --filter study-abroad-mobile exec tsc --noEmit

      - name: Upload API build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-build
          path: apps/api/dist
          retention-days: 7

      - name: Upload Web build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-build
          path: apps/web/.next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ── Docker Build ──────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          # ignore-error: a transient GHA cache-export hiccup ("error writing layer
          # blob: not_found") must not red the build — the image still builds, pushes,
          # and gets Trivy-scanned. Keeps mode=max cache reuse; only export failures
          # become non-fatal (observed flaking the job on run 27487900061, needing a
          # manual re-run — make the gate trustworthy rather than rely on re-runs).
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master 2026-08-25
        with:
          image-ref: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

  # ── SBOM Generation ───────────────────────────────────────
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          npx @cyclonedx/cdxgen -o sbom/bom.json --deep -t js --spec-version 1.5

      - name: Verify SBOM
        run: pnpm sbom:verify

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: sbom/bom.json
          retention-days: 90

  # ── Deploy to GCP ─────────────────────────────────────────
  deploy-gcp:
    name: Deploy to GCP
    runs-on: ubuntu-latest
    needs: [build, e2e, security]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy == true && inputs.inspect_release != true)
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm for post-deploy acceptance
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js for post-deploy acceptance
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install post-deploy acceptance dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-deploy@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Validate production administrator password hash
        env:
          ADMIN_BOOTSTRAP_PASSWORD_HASH_B64: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD_HASH_B64 }}
        run: |
          if [ -z "$ADMIN_BOOTSTRAP_PASSWORD_HASH_B64" ]; then
            echo "::error::ADMIN_BOOTSTRAP_PASSWORD_HASH_B64 repository secret is required"
            exit 1
          fi
          ADMIN_HASH="$ADMIN_BOOTSTRAP_PASSWORD_HASH_B64" node -e '
            const hash = Buffer.from(process.env.ADMIN_HASH, "base64").toString("utf8");
            if (!/^\$2[aby]\$\d{2}\$[./A-Za-z0-9]{53}$/.test(hash)) process.exit(1);
          '

      - name: Save previous revision for rollback
        id: prev
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          PREV=$(gcloud run services describe study-abroad-api \
            --region="$REGION" --format=json 2>/dev/null | \
            node scripts/ci/cloud-run-canary-url.mjs \
              --full-traffic-revision 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            echo "::error::Could not identify the live 100% revision for rollback"
            exit 1
          fi
          echo "revision=$PREV" >> $GITHUB_OUTPUT

      - name: Initialize sanitized release evidence
        run: |
          mkdir -p /tmp/harness-release-evidence
          node -e 'const fs=require("node:fs"); fs.writeFileSync("/tmp/harness-release-evidence/harness-acceptance.json", JSON.stringify({schemaVersion:"ai-agent-harness-acceptance-v1", revision:"", records:[], pass:false, reasonCodes:["HARNESS_ACCEPTANCE_NOT_REACHED"]})+"\\n")'

      # Read-only release prerequisite. This never creates, restores, or
      # deletes a backup; it records only Cloud SQL configuration and backup
      # timestamps in a sanitized artifact.
      - name: Verify Cloud SQL backup and PITR (read-only)
        id: cloud-sql-backup
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_CLOUDSQL_INSTANCE: ${{ secrets.GCP_CLOUDSQL_INSTANCE }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
        run: |
          mkdir -p /tmp/harness-release-evidence
          EVIDENCE=/tmp/harness-release-evidence/cloud-sql-backup-pitr.json
          if ! node scripts/ci/verify-cloud-sql-backup-pitr.mjs \
              --instance "$GCP_CLOUDSQL_INSTANCE" \
              --project "$GCP_PROJECT_ID" \
              --output "$EVIDENCE"; then
            node -e '
              const fs = require("node:fs");
              const evidence = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (JSON.stringify(evidence.reasonCodes) !== JSON.stringify(["gcloud_read_only_check_failed"])) process.exit(1);
            ' "$EVIDENCE"
            node scripts/ci/verify-cloud-sql-backup-pitr-via-run-job.mjs \
              --instance "$GCP_CLOUDSQL_INSTANCE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --service study-abroad-api \
              --output "$EVIDENCE"
          fi

      - name: Upload Cloud SQL backup/PITR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloud-sql-backup-pitr-${{ github.sha }}
          path: /tmp/harness-release-evidence/cloud-sql-backup-pitr.json
          if-no-files-found: error
          retention-days: 90

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        id: production-image
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          SHA="${GITHUB_SHA::7}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/study-abroad/api"
          docker build -f apps/api/Dockerfile -t "${IMAGE}:${SHA}" -t "${IMAGE}:latest" .
          PUSH_OUTPUT=$(docker push "${IMAGE}:${SHA}" 2>&1)
          printf '%s\n' "$PUSH_OUTPUT"
          docker push "${IMAGE}:latest"
          DIGEST=$(printf '%s\n' "$PUSH_OUTPUT" \
            | sed -nE 's/^.*digest: (sha256:[a-f0-9]{64}) size:.*$/\1/p' \
            | tail -n 1)
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "::error::Docker push did not return a valid sha256 digest"
            exit 1
          fi
          echo "IMAGE_NAME=${IMAGE}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${IMAGE}@${DIGEST}" >> "$GITHUB_ENV"
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate signed production image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.production-image.outputs.name }}
          subject-digest: ${{ steps.production-image.outputs.digest }}

      - name: Verify production image provenance before deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://${IMAGE_REF}" \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"

      - name: Run database migrations
        run: |
          REGION="${{ secrets.GCP_REGION }}"

          JOB_ARGS=(
            --image="$IMAGE_REF"
            --region="$REGION"
            --vpc-connector=projects/${{ secrets.GCP_PROJECT_ID }}/locations/$REGION/connectors/study-abroad-connector
            --vpc-egress=private-ranges-only
            --task-timeout=300
            --max-retries=0
            --command="./migrate.sh"
            --set-secrets="DATABASE_URL=database-url:latest"
            --quiet
          )

          if gcloud run jobs describe study-abroad-migrate --region="$REGION" --quiet >/dev/null 2>&1; then
            # Clear any previously set env var to avoid conflict with secret reference
            gcloud run jobs update study-abroad-migrate \
              --region="$REGION" \
              --remove-env-vars=DATABASE_URL \
              --quiet 2>/dev/null || true
            gcloud run jobs update study-abroad-migrate "${JOB_ARGS[@]}"
          else
            gcloud run jobs create study-abroad-migrate "${JOB_ARGS[@]}"
          fi

          # Capture execution name so we can pull its logs in the next step.
          EXEC_NAME=$(gcloud run jobs execute study-abroad-migrate \
            --region="$REGION" \
            --wait \
            --format='value(metadata.name)' \
            2>&1 | tee /tmp/migrate-exec.log | tail -n1)
          echo "exec_name=$EXEC_NAME" >> $GITHUB_ENV
          cat /tmp/migrate-exec.log

      - name: Try gcloud alpha/beta run jobs executions logs read
        if: always()
        continue-on-error: true
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          EXEC="${exec_name}"
          echo "=== try alpha ==="
          gcloud alpha run jobs executions logs read "${EXEC}" --region="$REGION" 2>&1 | head -200 || true
          echo "=== try beta ==="
          gcloud beta run jobs executions logs read "${EXEC}" --region="$REGION" 2>&1 | head -200 || true
          echo "=== try main ==="
          gcloud run jobs executions logs read "${EXEC}" --region="$REGION" 2>&1 | head -200 || true
          echo "=== end ==="

      - name: Compare migrate DATABASE_URL host with API DATABASE_URL host
        if: always()
        run: |
          # The migrate-job uses `database-url:latest` while the API service
          # uses `database-url-proxy:latest`. Sanity-check they point at the
          # same Cloud SQL instance — if not, the migrate is writing to a
          # different DB entirely, which would perfectly explain why prod
          # gallery shows 5 essays despite `migrate.sh` succeeding.
          set +e
          MIGRATE_URL=$(gcloud secrets versions access latest --secret=database-url 2>/dev/null)
          API_URL=$(gcloud secrets versions access latest --secret=database-url-proxy 2>/dev/null)
          set -e

          # Strip credentials so we never log them; keep host + db name only.
          sanitize() {
            # postgresql://user:pass@host:port/db?... → host:port/db
            printf '%s' "$1" | sed -E 's#postgresql://[^@]+@([^?]+).*#\1#'
          }
          M_HOST=$(sanitize "$MIGRATE_URL")
          A_HOST=$(sanitize "$API_URL")
          echo "migrate host/db: ${M_HOST:-<empty>}"
          echo "api host/db    : ${A_HOST:-<empty>}"
          # Strip the path/host part for direct comparison ignoring port differences
          # since proxy uses a unix socket and direct uses an IP.
          # We compare just the database name (last path segment before ?).
          db_name() { printf '%s' "$1" | sed -E 's#.*/([^/?]+)([?].*)?$#\1#'; }
          M_DB=$(db_name "$M_HOST")
          A_DB=$(db_name "$A_HOST")
          echo "migrate DB name: ${M_DB:-<empty>}"
          echo "api DB name    : ${A_DB:-<empty>}"
          if [ "$M_DB" != "$A_DB" ] && [ -n "$M_DB" ] && [ -n "$A_DB" ]; then
            echo "::error::Migrate job and API service connect to DIFFERENT databases: '$M_DB' vs '$A_DB'"
          else
            echo "✓ Same DB name on both sides."
          fi

      # ACCOUNT_PURGE_* are stated in --set-env-vars below rather than left to
      # the zod defaults in env.validation.ts. Both values EQUAL those defaults,
      # so this changes no behaviour — it makes the current behaviour reviewable.
      #
      # ENABLED=false is a lock. AccountPurgeService is the one job in the system
      # that destroys data with no undo, and its first enabled run purges the
      # entire soft-deleted backlog at once. Whether it runs should not be able
      # to change because someone edited a schema default.
      #
      # GRACE_DAYS=30 is a promise. The account-deletion copy has to name this
      # same number, and .claude/rules/security.md forbids restoring that copy
      # until ENABLED is true in production. A promise whose number lives only in
      # a default is one edit away from being false.
      #
      # REDIS_COMMAND_TIMEOUT_MS=3000 raises the 1000ms default. That deadline is
      # CLIENT-SIDE, so it also counts time this container spent without CPU —
      # and with `--cpu-throttling` and `min-instances=0` below, an idle
      # instance's event loop is starved until a request or a @Cron timer wakes
      # it. 1000ms did not cover the wake-up: prod tripped Redis's circuit
      # breaker 60-85 times a day for a month, and every locked @Cron inside
      # those 30s windows silently skipped. AccountPurgeService had never once
      # completed a run.
      #
      # 3000 is a trade, not a fix: a Redis read on the request path can now
      # stall 3s before falling back to its miss path. The actual fix is not
      # running @Cron on a CPU-throttled service — which is CRON_DRIVER=http:
      # no in-process timers register in prod; Cloud Scheduler drives
      # POST /internal/cron/:name/run (one scheduler job per @Cron, synced from
      # .github/cron-jobs.json in the "Sync Cloud Scheduler" step below). CPU is
      # guaranteed during a request and one firing is single-flight by
      # construction. CRON_SECRET is the fail-closed auth for that endpoint —
      # if the secret is missing the deploy fails at the assert step, because
      # a 401 there means every scheduled job is silently off.
      #
      # --timeout=1800 (was 300): a scheduler-driven job holds its request open
      # for the whole run (ending the response surrenders the CPU), so the
      # request ceiling must cover the slowest job. Scheduler attempt-deadline
      # is 1740s, under this. Side effect: WebSocket connections may now live
      # 30min instead of 5 before Cloud Run recycles them (clients reconnect).
      #
      # Uploads live on a GCS volume, not the container disk. Before this, nothing
      # set STORAGE_TYPE (so it defaulted to 'local') and no volume was mounted —
      # verified 2026-08-17, `spec.template.spec.volumes` was []. Every upload
      # therefore landed on Cloud Run's ephemeral per-instance filesystem: gone on
      # the next revision, and invisible to sibling instances in the meantime.
      # Deleting a file was the smaller half of that problem.
      #
      # `STORAGE_LOCAL_PATH` covers both directions in one variable — StorageService
      # writes there and main.ts serves it via express.static — so the 'local'
      # provider keeps working unchanged and no code moves.
      #
      # The volume flags are as replace-y as --set-env-vars: dropping them from this
      # line silently returns the service to the ephemeral disk with nothing failing.
      # Note `--set-env-vars` REPLACES the whole set: anything dropped from this
      # line reverts to unset on the next deploy.
      - name: Deploy canary (no traffic)
        id: deploy-canary
        if: success()
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          gcloud run deploy study-abroad-api \
            --image="$IMAGE_REF" \
            --region="$REGION" \
            --platform=managed \
            --max-instances=3 \
            --min-instances=0 \
            --cpu-throttling \
            --session-affinity \
            --vpc-connector=projects/${{ secrets.GCP_PROJECT_ID }}/locations/$REGION/connectors/study-abroad-connector \
            --vpc-egress=private-ranges-only \
            --add-cloudsql-instances=${{ secrets.GCP_CLOUDSQL_INSTANCE }} \
            --add-volume=name=uploads,type=cloud-storage,bucket=study-abroad-prod-2025-uploads \
            --add-volume-mount=volume=uploads,mount-path=/mnt/uploads \
            --set-env-vars="^|^NODE_ENV=production|STORAGE_LOCAL_PATH=/mnt/uploads|FRONTEND_URL=https://www.lumniedu.com|CORS_ORIGINS=https://study-abroad-platform-web.vercel.app,https://www.lumniedu.com,https://lumniedu.com|LLM_PROVIDER=openai|OPENAI_MODEL=gpt-4o-mini|OPENAI_BASE_URL=https://api.openai.com/v1|AI_AGENT_NATIVE_CLAUDE_V1=false|AI_AGENT_MODEL_ROUTING_V1=false|AI_AGENT_MODEL_ROUTING_CONFIG={}|AI_AGENT_HARNESS_V1=true|AI_AGENT_HARNESS_MODE=action|AI_AGENT_APPROVALS_V1=true|AI_AGENT_APPROVAL_TTL_MS=900000|AI_AGENT_RUN_TTL_MS=86400000|AI_AGENT_RUN_RETENTION_DAYS=90|AI_AGENT_TRACE_RETENTION_DAYS=30|AI_AGENT_EXECUTION_LEASE_MS=120000|AI_AGENT_CONTEXT_V1=true|AI_AGENT_ACCEPTANCE_V1=true|AI_AGENT_SKILLS_V1=true|AI_AGENT_SKILLS_EVOLUTION_V1=true|AI_AGENT_SKILLS_AUTO_PUBLISH_V1=true|AI_AGENT_MAX_TOKENS_PER_RUN=24000|AI_AGENT_MAX_DURATION_MS=120000|AI_AGENT_CONTEXT_RECENT_MESSAGES=10|ADMIN_BOOTSTRAP_EMAIL=admin@example.com|ADMIN_BOOTSTRAP_PASSWORD_HASH_B64=${{ secrets.ADMIN_BOOTSTRAP_PASSWORD_HASH_B64 }}|EMAIL_FROM=noreply@lumniedu.com|EMAIL_FROM_NAME=Lumni|ACCOUNT_PURGE_ENABLED=true|ACCOUNT_PURGE_GRACE_DAYS=30|REDIS_COMMAND_TIMEOUT_MS=3000|CRON_DRIVER=http" \
            --set-secrets="DATABASE_URL=database-url-proxy:latest,JWT_SECRET=jwt-secret:latest,JWT_REFRESH_SECRET=jwt-refresh-secret:latest,VAULT_ENCRYPTION_KEY=vault-encryption-key:latest,OPENAI_API_KEY=openai-api-key:latest,REDIS_URL=redis-url:latest,RESEND_API_KEY=resend-api-key:latest,TAVILY_API_KEY=tavily-api-key:latest,CRON_SECRET=cron-secret:latest" \
            --timeout=1800 \
            --no-traffic \
            --tag=canary \
            --quiet

          REVISION=$(gcloud run services describe study-abroad-api \
            --region="$REGION" \
            --format='value(status.latestCreatedRevisionName)')
          if [ -z "$REVISION" ]; then
            echo "::error::Could not resolve the deployed Cloud Run revision"
            exit 1
          fi
          echo "revision=$REVISION" >> $GITHUB_OUTPUT

      - name: Canary smoke test
        id: canary-smoke
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          CANARY_URL=""
          for i in 1 2 3 4 5; do
            SERVICE_JSON=$(gcloud run services describe study-abroad-api --region="$REGION" --format=json 2>/dev/null || echo '{}')
            CANARY_URL=$(printf '%s' "$SERVICE_JSON" | node scripts/ci/cloud-run-canary-url.mjs --tag canary 2>/dev/null || true)
            if [ -n "$CANARY_URL" ]; then
              break
            fi
            echo "⏳ Canary URL not ready (attempt $i)"
            sleep 5
          done
          if [ -z "$CANARY_URL" ]; then
            echo "::error::Could not get canary URL for Cloud Run tag 'canary'"
            exit 1
          fi
          echo "canary_url=$CANARY_URL" >> $GITHUB_OUTPUT
          sleep 5
          for i in 1 2 3; do
            RESPONSE=$(curl -s "$CANARY_URL/health" --max-time 15 || echo '{}')
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$CANARY_URL/health" --max-time 15 || true)
            STATUS="${STATUS:-000}"
            if printf '%s' "$RESPONSE" | node scripts/ci/validate-deploy-health.mjs --http-status "$STATUS" --label "Canary"; then
              exit 0
            fi
            echo "⏳ Canary check attempt $i did not meet deploy-critical health"
            sleep 5
          done
          echo "::error::Canary health check failed"
          exit 1

      # Prove the exact no-traffic revision exposes every scheduled job before
      # it can receive user traffic. The post-promote check below additionally
      # verifies that the stable service URL has converged to this revision.
      - name: Assert canary cron registry matches manifest
        if: success()
        run: |
          CANARY_URL="${{ steps.canary-smoke.outputs.canary_url }}"
          CRON_SECRET=$(gcloud secrets versions access latest --secret=cron-secret)
          echo "::add-mask::$CRON_SECRET"
          CRON_TARGET_URL="$CANARY_URL" CRON_SECRET="$CRON_SECRET" \
            node scripts/ci/assert-cron-manifest.mjs

      # Database/Redis health alone cannot prove the Provider, planning,
      # compression or approval path. Prove those on the isolated revision too.
      - name: Run Harness acceptance before traffic promotion
        id: harness-pre-promote
        if: success()
        env:
          HARNESS_API_BASE: ${{ steps.canary-smoke.outputs.canary_url }}/api/v1
          HARNESS_ADMIN_EMAIL: admin@example.com
          HARNESS_ADMIN_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
          HARNESS_EXPECTED_REVISION: ${{ steps.deploy-canary.outputs.revision }}
        run: |
          node scripts/ci/run-harness-pre-promote.mjs

      - name: Upload sanitized pre-promotion Harness evidence
        if: always() && steps.harness-pre-promote.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-agent-harness-pre-promote-${{ github.sha }}
          path: /tmp/harness-pre-promote/harness-acceptance.json
          if-no-files-found: error
          retention-days: 90

      - name: Promote canary to full traffic
        if: success()
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          REVISION="${{ steps.deploy-canary.outputs.revision }}"
          gcloud run services update-traffic study-abroad-api \
            --region="$REGION" \
            --to-revisions="$REVISION=100" \
            --quiet

      - name: Smoke test
        id: smoke
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          URL=$(gcloud run services describe study-abroad-api --region=$REGION --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

          # Wait for new revision to stabilize
          sleep 10

          # Health check with retries (validate response body, not just HTTP 200)
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s "$URL/health" --max-time 15 || echo '{}')
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health" --max-time 15 || true)
            STATUS="${STATUS:-000}"
            if printf '%s' "$RESPONSE" | node scripts/ci/validate-deploy-health.mjs --http-status "$STATUS" --label "Post-promote"; then
              echo "::notice title=API deployed::Cloud Run URL: $URL"
              exit 0
            fi
            echo "⏳ Health check attempt $i did not meet deploy-critical health"
            sleep 5
          done
          echo "::error::Health check failed after 5 attempts"
          exit 1

      # Provision one Cloud Scheduler job per @Cron (manifest-driven; see
      # scripts/check-cron-manifest.ts). Runs AFTER traffic promotion so the
      # asserted registry is the code actually serving. Failure here fails the
      # deploy and triggers the rollback step.
      - name: Sync Cloud Scheduler cron jobs
        if: success()
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          URL="${{ steps.smoke.outputs.url }}"
          CRON_SECRET=$(gcloud secrets versions access latest --secret=cron-secret)
          echo "::add-mask::$CRON_SECRET"
          GCP_PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}" GCP_REGION="$REGION" \
            CRON_TARGET_URL="$URL" CRON_SECRET="$CRON_SECRET" \
            node scripts/ci/sync-cloud-scheduler.mjs

      # Closes the loop between the AST-derived manifest and the runtime
      # registry: any drift (or a broken CRON_SECRET mount) fails the deploy
      # here, one step away from rollback — instead of surfacing as scheduled
      # jobs silently never running (#553's failure shape).
      - name: Assert live cron registry matches manifest
        if: success()
        run: |
          URL="${{ steps.smoke.outputs.url }}"
          CRON_SECRET=$(gcloud secrets versions access latest --secret=cron-secret)
          echo "::add-mask::$CRON_SECRET"
          for attempt in 1 2 3 4 5 6; do
            if CRON_TARGET_URL="$URL" CRON_SECRET="$CRON_SECRET" \
              node scripts/ci/assert-cron-manifest.mjs; then
              exit 0
            fi
            echo "Waiting for the stable Cloud Run URL to converge to the promoted revision (attempt $attempt/6)"
            sleep 10
          done
          echo "::error::Live cron registry did not converge after traffic promotion"
          exit 1

      # Post-100% production acceptance is the final application gate. The
      # runner uses a disposable synthetic account and emits only allowlisted
      # evidence. The validator rejects any new field before an artifact is
      # uploaded, so prompts, tool payloads, tokens, and personal data cannot
      # enter the release record.
      - name: Run Harness production acceptance after 100% promotion
        id: harness-acceptance
        if: success()
        env:
          HARNESS_API_BASE: ${{ steps.smoke.outputs.url }}/api/v1
          HARNESS_ADMIN_EMAIL: admin@example.com
          HARNESS_ADMIN_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
          HARNESS_EXPECTED_REVISION: ${{ steps.deploy-canary.outputs.revision }}
        run: |
          mkdir -p /tmp/harness-release-evidence
          if [ -z "$HARNESS_ADMIN_PASSWORD" ]; then
            echo "::error::ADMIN_BOOTSTRAP_PASSWORD repository secret is required for post-deploy acceptance"
            node -e 'const fs=require("node:fs"); fs.writeFileSync("/tmp/harness-release-evidence/harness-acceptance.json", JSON.stringify({schemaVersion:"ai-agent-harness-acceptance-v1", revision:process.env.HARNESS_EXPECTED_REVISION, records:[], pass:false, reasonCodes:["ADMIN_BOOTSTRAP_PASSWORD_MISSING"]})+"\\n")'
            exit 1
          fi
          echo "::add-mask::$HARNESS_ADMIN_PASSWORD"
          set +e
          # Invoke Node directly. Any pnpm wrapper may append lifecycle/error
          # messages to stdout when the runner exits non-zero, corrupting the
          # strict JSONL evidence precisely when a scenario fails.
          node --import tsx apps/api/scripts/ai-agent-harness-acceptance.ts --production \
            > /tmp/harness-release-evidence/runner.jsonl \
            2> /tmp/harness-release-evidence/runner.stderr
          RUNNER_STATUS=$?
          set -e
          set +e
          HARNESS_EVIDENCE_INPUT=/tmp/harness-release-evidence/runner.jsonl \
            HARNESS_EVIDENCE_OUTPUT=/tmp/harness-release-evidence/harness-acceptance.json \
            HARNESS_EXPECTED_REVISION="${HARNESS_EXPECTED_REVISION}" \
            node scripts/ci/validate-harness-acceptance-evidence.mjs
          VALIDATOR_STATUS=$?
          set -e
          if [ "$RUNNER_STATUS" -ne 0 ]; then
            echo "::error::Harness production runner failed (status ${RUNNER_STATUS})"
            exit "$RUNNER_STATUS"
          fi
          exit "$VALIDATOR_STATUS"

      - name: Upload sanitized Harness acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-agent-harness-acceptance-${{ github.sha }}
          path: /tmp/harness-release-evidence/harness-acceptance.json
          if-no-files-found: error
          retention-days: 90

      # Deleting stale schedules happens ONLY after the assert passes. Rollback
      # reverts traffic, never scheduler topology — pruning earlier would leave
      # a failed deploy's rolled-back revision missing schedules it still needs.
      - name: Prune stale Cloud Scheduler jobs
        if: success()
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          URL="${{ steps.smoke.outputs.url }}"
          CRON_SECRET=$(gcloud secrets versions access latest --secret=cron-secret)
          echo "::add-mask::$CRON_SECRET"
          GCP_PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}" GCP_REGION="$REGION" \
            CRON_TARGET_URL="$URL" CRON_SECRET="$CRON_SECRET" \
            node scripts/ci/sync-cloud-scheduler.mjs --prune-only

      - name: Probe prod essay gallery count
        if: always()
        continue-on-error: true
        run: |
          # Direct user-visible signal: how many essays did the migrate
          # actually load? Hits the public, no-auth endpoint with the
          # full v1 prefix (gallery returns total in response.data.total).
          URL="https://www.lumniedu.com/api/v1/essay-ai/gallery?page=1&pageSize=1"
          RESPONSE=$(curl -fsS "$URL" --max-time 15 || echo '{"data":{"total":-1}}')
          TOTAL=$(printf '%s' "$RESPONSE" | node -e "
            let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
              try{console.log(JSON.parse(s).data.total)}catch(e){console.log('parse_error')}
            });
          ")
          echo "Prod gallery total = ${TOTAL}"
          if [ "$TOTAL" -lt 150 ] 2>/dev/null; then
            echo "::warning::Essay gallery total is ${TOTAL} (expected >= 150)"
          else
            echo "✓ Essay gallery total is ${TOTAL} (>= 150)"
          fi

      - name: Rollback on failure
        if: failure() && steps.prev.outputs.revision != ''
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          PREV="${{ steps.prev.outputs.revision }}"
          echo "::warning::Rolling back to previous revision: $PREV"
          gcloud run services update-traffic study-abroad-api \
            --region="$REGION" \
            --to-revisions="$PREV=100" \
            --quiet

          URL=$(gcloud run services describe study-abroad-api \
            --region="$REGION" --format='value(status.url)')
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s "$URL/health" --max-time 15 || echo '{}')
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
              "$URL/health" --max-time 15 || true)
            STATUS="${STATUS:-000}"
            if printf '%s' "$RESPONSE" | node scripts/ci/validate-deploy-health.mjs \
              --http-status "$STATUS" --label "Rollback"; then
              LIVE_REVISION=$(gcloud run services describe study-abroad-api \
                --region="$REGION" --format=json | \
                node scripts/ci/cloud-run-canary-url.mjs \
                  --full-traffic-revision)
              if [ "$LIVE_REVISION" != "$PREV" ]; then
                echo "::error::Rollback traffic points to an unexpected revision"
                exit 1
              fi
              echo "::notice::Rollback completed and previous revision is healthy"
              exit 0
            fi
            echo "Waiting for rollback health convergence (attempt $i/5)"
            sleep 5
          done
          echo "::error::Rollback traffic update completed but health verification failed"
          exit 1
