name: CI

on:
  push:
    branches: [main, develop]
  # Deliberately no `branches:` filter. It matches the BASE branch, so a PR
  # stacked on anything unlisted got zero jobs dispatched while `gh pr checks`
  # still showed Vercel and GitGuardian green — a PR that looks reviewed and
  # was never built. The list had also drifted out of contact with reality:
  # it named `feature/**` and `release/**`, which this repo has never used,
  # and omitted `feat/**`, `chore/**`, `perf/**` and `docs/**`, which it does.
  # Adding the four missing prefixes would only move the hole to the next new
  # one. There is no base branch for which "run no CI at all" is the answer.
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to GCP after CI passes'
        required: false
        type: boolean
        default: true
      inspect_release:
        description: 'Read-only Cloud Run revision/configuration and sanitized Provider error inspection'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  release-inspection:
    name: Inspect production release (read-only)
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-deploy@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Inspect without reading secret values or changing production
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
        run: node scripts/ci/inspect-agent-release.mjs

  # ── Change Detection ─────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      shared: ${{ steps.filter.outputs.shared }}
      ci: ${{ steps.filter.outputs.ci }}
      extension: ${{ steps.filter.outputs.extension }}
      any_app: ${{ steps.filter.outputs.api == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.mobile == 'true' || steps.filter.outputs.shared == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'pnpm-lock.yaml'
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
            shared:
              - 'packages/shared/**'
            extension:
              - 'packages/browser-extension/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
            ci:
              - '.github/workflows/**'
              - '.github/deploy-config.json'
              - 'scripts/**'
              - 'turbo.json'
              - 'package.json'

  # ── Lint ──────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_app == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Root guardrails include the gate-proof runner, and check-recurrence
        # counts how often a file has appeared in FIX commits. A default depth-1
        # checkout has no history to count, so it reported "no fix-hotspots" —
        # the same answer it gives for a genuinely clean tree. Its proof caught
        # that (seeded --threshold=1 did not fire); the gate now also says so.
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo Cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      # 这一步不能省：下面的 lint 是 `pnpm --filter api lint`（直接调，不走 turbo），
      # 所以 turbo.json 里给 lint 声明的 `dependsOn: ["db:generate"]` 覆盖不到这里。
      # 没有生成的 Prisma client，@typescript-eslint 的类型感知规则拿到的是残缺类型：
      # 报出来的东西不可信，而且 `--fix` 会把必需的类型断言当成多余删掉（本地实测
      # 会写坏 31 个文件 / 新增 70 个 typecheck 错误）。CI 因为 checkout 用完即弃
      # 而没出事，但这一直意味着 api 的 lint 结果是拿错误类型信息算出来的。
      - name: Generate Prisma client (lint 的类型感知规则依赖它)
        run: pnpm --filter api db:generate

      # Root route/closure gates import the full-surface registry, which in
      # turn resolves @study-abroad/shared through its package `require` entry
      # (`dist/index.js`). A developer checkout often already has dist/ from a
      # previous build, but a clean CI checkout does not. Build it explicitly
      # so gate proofs test the seeded violation instead of failing before the
      # gate can start (PR #594 exposed this clean-checkout-only dependency).
      - name: Build shared package (root gate runtime dependency)
        run: pnpm --filter @study-abroad/shared build

      - name: Lint all apps (parallel)
        run: |
          FAIL=0
          if [[ "${{ needs.detect-changes.outputs.api }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter api lint &
            PID_API=$!
          fi
          if [[ "${{ needs.detect-changes.outputs.web }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter web lint &
            PID_WEB=$!
          fi
          if [[ "${{ needs.detect-changes.outputs.mobile }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter study-abroad-mobile lint &
            PID_MOBILE=$!
          fi
          [ -n "${PID_API:-}" ] && { wait $PID_API || FAIL=1; }
          [ -n "${PID_WEB:-}" ] && { wait $PID_WEB || FAIL=1; }
          [ -n "${PID_MOBILE:-}" ] && { wait $PID_MOBILE || FAIL=1; }
          exit $FAIL

      - name: Quality & i18n checks (parallel)
        run: |
          FAIL=0
          if [[ "${{ needs.detect-changes.outputs.web }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter web lint:i18n &
            PID_I18N=$!
            pnpm --filter web lint:quality &
            PID_WQ=$!
          fi
          if [[ "${{ needs.detect-changes.outputs.api }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter api lint:quality &
            PID_AQ=$!
          fi
          if [[ "${{ needs.detect-changes.outputs.mobile }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter study-abroad-mobile lint:quality &
            PID_MQ=$!
          fi
          [ -n "${PID_I18N:-}" ] && { wait $PID_I18N || FAIL=1; }
          [ -n "${PID_WQ:-}" ] && { wait $PID_WQ || FAIL=1; }
          [ -n "${PID_AQ:-}" ] && { wait $PID_AQ || FAIL=1; }
          [ -n "${PID_MQ:-}" ] && { wait $PID_MQ || FAIL=1; }
          exit $FAIL

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          git fetch --unshallow || true
          pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      # `pnpm audit` itself is broken — npmjs.org retired the classic audit
      # REST endpoints it calls (410). The real fix (pnpm v11) needs Node
      # >=22.13, which this repo doesn't run. osv-scanner reads pnpm-lock.yaml
      # directly instead — no dependency on that endpoint. Same pinned-binary
      # pattern as the gitleaks install above. See scripts/check-dependency-audit.ts.
      - name: Install osv-scanner
        run: |
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64" \
            -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Dependency audit
        run: pnpm exec tsx scripts/check-dependency-audit.ts

      - name: Integration check
        run: pnpm lint:integration --verbose

      - name: Governance check (blocking)
        run: pnpm lint:integration --domain=governance

      - name: CI release-script tests
        run: node --test scripts/ci/*.test.mjs

      - name: Root guardrails (coverage / any / file-size / gate-proof ratchets, audit gate, deploy drift, seed parity)
        run: |
          pnpm lint:coverage-ratchet
          pnpm lint:any-ratchet
          pnpm lint:file-size
          pnpm lint:gate-proofs
          pnpm lint:audit-gate
          pnpm lint:deploy-drift
          pnpm lint:ai-agent-env-docs
          pnpm lint:ai-agent-doc-facts
          pnpm lint:ai-agent-enterprise-controls
          pnpm lint:seed-parity
          # Dated reference data (exam calendar, competition schedule) that has
          # stopped covering the planning horizon. migrate.sh converges the DB to
          # the repo on every deploy, so an expired calendar loads perfectly and
          # reports success — nothing else can tell you it went stale. Listed
          # explicitly for the same reason as lint:cron-manifest below: this job
          # does not run lint:all.
          pnpm lint:seed-freshness
          # User-facing deletion copy vs ACCOUNT_PURGE_ENABLED / _GRACE_DAYS.
          # A retention period in the UI is a claim about a background job;
          # promising one while the job is off, or promising a different number
          # than it uses, breaks nothing and shows up nowhere. Listed explicitly
          # — this job does not run lint:all.
          pnpm lint:deletion-promise
          # Contested dependency majors (the intentional zod 3-app / 4-knip split).
          # Lived in pre-push only, so `git push --no-verify` skipped it entirely
          # and nothing downstream would have noticed the pins converging.
          # Listed explicitly — this job does not run lint:all.
          pnpm lint:dep-pins
          # .github/cron-jobs.json vs the @Cron decorators. Under
          # CRON_DRIVER=http a job missing from that manifest gets no Cloud
          # Scheduler entry and therefore never runs in prod — while running
          # fine in dev. Listed explicitly rather than relying on
          # lint:gate-proofs happening to invoke it via its proof's clean-tree
          # precondition.
          pnpm lint:cron-manifest

      # Cross-layer guards that lint:all runs but the pre-push hook is the only
      # other enforcer of — wired into CI so a `git push --no-verify` (or a
      # contributor without the husky hook) can't bypass them.
      #   routes  — client API paths match @Controller() routes
      #   journeys— user-journey path integrity
      #   icons   — no banned AI-feeling lucide icons / emoji in web UI chrome
      #   drift   — CLAUDE.md / BRIEF.md / manifest vs the actual files.
      #     Was local-only until .claude/agents + .claude/manifests were
      #     gitignored-by-accident; a fresh checkout had 1 agent file and no
      #     manifest, so the check errored for everyone but the one machine
      #     that had them untracked on disk. They travel with the repo now
      #     (see .gitignore), which is what makes this runnable here.
      #   closure — the UI route inventory: every registered pattern has a page
      #     file, every page file is registered, for web and mobile both. It
      #     existed and passed locally but nothing ever ran it: package.json
      #     only invoked it as `--self-test`, which exercises the checker's own
      #     fixtures, not the repo. `/admin/points-redemptions` sat unregistered
      #     on main until #529 — the check that would have caught it was already
      #     written. A gate nobody calls is not a gate.
      - name: Cross-layer guards (routes / closure / journeys / icons / drift)
        run: |
          # The route gate's OWN fixtures — valid calls, wrong methods, wrong
          # suffixes, dynamic params. It had zero callers: not lint:all, not CI,
          # not husky. An unproven gate is the failure mode lint:gate-proofs
          # exists to prevent, and this one was sitting outside it.
          pnpm lint:routes:test
          pnpm lint:routes
          pnpm lint:closure
          pnpm lint:journeys
          pnpm quality:icons
          pnpm lint:drift
          pnpm lint:e2e-runner

      # Prettier drift gate: whole-repo `prettier --check` (ts/tsx). lint-staged
      # only formats *changed* files, so old files silently drift when the config
      # or prettier version moves; a broad `prettier --write` then surfaces 100+
      # stray reformats that read as churn. This keeps main formatted so that can't
      # happen. `.prettierignore` excludes generated/data (mobile native, gold-cases).
      - name: Format check (Prettier drift gate)
        run: pnpm format:check

      - name: Dead code check (knip)
        run: pnpm lint:dead-code

  # ── Type Check ────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_app == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo Cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Type check all apps (parallel)
        run: |
          FAIL=0
          if [[ "${{ needs.detect-changes.outputs.api }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter api exec tsc --noEmit --project tsconfig.build.json &
            PID_API=$!
          fi
          if [[ "${{ needs.detect-changes.outputs.web }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter web exec tsc --noEmit &
            PID_WEB=$!
          fi
          if [[ "${{ needs.detect-changes.outputs.mobile }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter study-abroad-mobile exec tsc --noEmit &
            PID_MOBILE=$!
          fi
          [ -n "${PID_API:-}" ] && { wait $PID_API || FAIL=1; }
          [ -n "${PID_WEB:-}" ] && { wait $PID_WEB || FAIL=1; }
          [ -n "${PID_MOBILE:-}" ] && { wait $PID_MOBILE || FAIL=1; }
          exit $FAIL

  # ── Unit Tests ────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_app == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo Cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Run AI Eval (Fixtures)
        if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
        run: pnpm exec tsx scripts/eval/run-eval.ts --mode=fixtures --verbose

      - name: Build shared package for Harness benchmark
        if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
        run: pnpm --filter @study-abroad/shared build

      - name: Run legacy ReWOO vs Harness benchmark gate
        if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
        run: |
          mkdir -p /tmp/ai-agent-benchmark
          pnpm harness:benchmark --output /tmp/ai-agent-benchmark/report.json

      - name: Upload sanitized Harness benchmark report
        if: always() && (needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-agent-harness-benchmark-${{ github.sha }}
          path: /tmp/ai-agent-benchmark/report.json
          if-no-files-found: error
          retention-days: 90

      - name: Run AI Agent semantic corpus and grader calibration gate
        if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
        run: |
          mkdir -p /tmp/ai-agent-semantic-eval
          pnpm harness:semantic-eval --output /tmp/ai-agent-semantic-eval/report.json

      - name: Upload sanitized AI Agent semantic evaluation report
        if: always() && (needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-agent-semantic-eval-${{ github.sha }}
          path: /tmp/ai-agent-semantic-eval/report.json
          if-no-files-found: error
          retention-days: 90

      - name: Run API tests
        if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
        run: pnpm --filter api exec jest --coverage --forceExit

      - name: Upload API coverage
        if: needs.detect-changes.outputs.api == 'true' || github.event_name == 'push'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/api/coverage/lcov.info
          flags: api
          fail_ci_if_error: false

      - name: Run Web tests
        if: needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
        # `--coverage` is REQUIRED, not a nicety: the `thresholds` block in
        # vitest.config.ts is only evaluated on a coverage run. Without it this
        # step was a plain `vitest run` and web's coverage floor — the number
        # `lint:coverage-ratchet` so carefully protects from being lowered — had
        # never once been checked in CI. Same for mobile below.
        run: pnpm --filter web exec vitest run --coverage

      - name: Run Mobile tests
        if: needs.detect-changes.outputs.mobile == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
        # `exec jest` (not `test -- …`) so jest receives the flags instead of reading
        # them as a test-path pattern; `--filter mobile` matched no project (the package
        # is `study-abroad-mobile`), so this step had been a silent no-op in CI.
        # `--runInBand` matches the package's own test scripts (parallel workers
        # were flaky here); keep the two in sync or CI and local diverge.
        run: pnpm --filter study-abroad-mobile exec jest --runInBand --coverage --forceExit

      - name: Run Shared tests
        if: needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
        # packages/shared had 21 test files and the repo's highest coverage floor
        # (90/80/95/90) and NO step here at all — the ratchet guarded a number CI
        # never evaluated. Added 2026-08-06; measured 92.43/82.30/96.64/93.81, so
        # it lands green with headroom.
        run: pnpm --filter @study-abroad/shared exec vitest run --coverage

  # ── Browser extension (isolated package; not in any_app) ──
  extension:
    name: Browser Extension
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.extension == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @study-abroad/shared build

      - name: Lint extension
        run: pnpm --filter @study-abroad/browser-extension lint

      - name: Test extension
        run: pnpm --filter @study-abroad/browser-extension test

  # ── E2E Tests ─────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: studyabroad_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
