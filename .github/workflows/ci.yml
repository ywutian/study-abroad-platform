name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, 'feature/**', 'fix/**', 'release/**']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to GCP after CI passes'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ── Change Detection ─────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      shared: ${{ steps.filter.outputs.shared }}
      ci: ${{ steps.filter.outputs.ci }}
      any_app: ${{ steps.filter.outputs.api == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.mobile == 'true' || steps.filter.outputs.shared == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'pnpm-lock.yaml'
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
            shared:
              - 'packages/shared/**'
            ci:
              - '.github/workflows/**'
              - '.github/deploy-config.json'
              - 'scripts/**'
              - 'turbo.json'
              - 'package.json'

  # ── Lint ──────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_app == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo Cache
        uses: dtinth/setup-github-actions-caching-for-turbo@v1

      - name: Lint all apps (parallel)
        run: |
          FAIL=0
          if [[ "${{ needs.detect-changes.outputs.api }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter api lint &
            PID_API=$!
          fi
          if [[ "${{ needs.detect-changes.outputs.web }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter web lint &
            PID_WEB=$!
          fi
          if [[ "${{ needs.detect-changes.outputs.mobile }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter study-abroad-mobile lint &
            PID_MOBILE=$!
          fi
          [ -n "${PID_API:-}" ] && { wait $PID_API || FAIL=1; }
          [ -n "${PID_WEB:-}" ] && { wait $PID_WEB || FAIL=1; }
          [ -n "${PID_MOBILE:-}" ] && { wait $PID_MOBILE || FAIL=1; }
          exit $FAIL

      - name: Quality & i18n checks (parallel)
        run: |
          FAIL=0
          if [[ "${{ needs.detect-changes.outputs.web }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter web lint:i18n &
            PID_I18N=$!
            pnpm --filter web lint:quality &
            PID_WQ=$!
          fi
          if [[ "${{ needs.detect-changes.outputs.api }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter api lint:quality &
            PID_AQ=$!
          fi
          if [[ "${{ needs.detect-changes.outputs.mobile }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter study-abroad-mobile lint:quality &
            PID_MQ=$!
          fi
          [ -n "${PID_I18N:-}" ] && { wait $PID_I18N || FAIL=1; }
          [ -n "${PID_WQ:-}" ] && { wait $PID_WQ || FAIL=1; }
          [ -n "${PID_AQ:-}" ] && { wait $PID_AQ || FAIL=1; }
          [ -n "${PID_MQ:-}" ] && { wait $PID_MQ || FAIL=1; }
          exit $FAIL

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          git fetch --unshallow || true
          pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      # `pnpm audit` itself is broken — npmjs.org retired the classic audit
      # REST endpoints it calls (410). The real fix (pnpm v11) needs Node
      # >=22.13, which this repo doesn't run. osv-scanner reads pnpm-lock.yaml
      # directly instead — no dependency on that endpoint. Same pinned-binary
      # pattern as the gitleaks install above. See scripts/check-dependency-audit.ts.
      - name: Install osv-scanner
        run: |
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64" \
            -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Dependency audit
        run: pnpm exec tsx scripts/check-dependency-audit.ts

      - name: Integration check
        run: pnpm lint:integration --verbose

      - name: Governance check (blocking)
        run: pnpm lint:integration --domain=governance

      - name: Root guardrails (coverage ratchet / audit gate / deploy drift / seed parity)
        run: |
          pnpm lint:coverage-ratchet
          pnpm lint:audit-gate
          pnpm lint:deploy-drift
          pnpm lint:seed-parity

      # Cross-layer guards that lint:all runs but the pre-push hook is the only
      # other enforcer of — wired into CI so a `git push --no-verify` (or a
      # contributor without the husky hook) can't bypass them.
      #   routes  — client API paths match @Controller() routes
      #   journeys— user-journey path integrity
      #   icons   — no banned AI-feeling lucide icons / emoji in web UI chrome
      #   drift   — CLAUDE.md / BRIEF.md / manifest vs the actual files.
      #     Was local-only until .claude/agents + .claude/manifests were
      #     gitignored-by-accident; a fresh checkout had 1 agent file and no
      #     manifest, so the check errored for everyone but the one machine
      #     that had them untracked on disk. They travel with the repo now
      #     (see .gitignore), which is what makes this runnable here.
      - name: Cross-layer guards (routes / journeys / icons / drift)
        run: |
          pnpm lint:routes
          pnpm lint:journeys
          pnpm quality:icons
          pnpm lint:drift

      # Prettier drift gate: whole-repo `prettier --check` (ts/tsx). lint-staged
      # only formats *changed* files, so old files silently drift when the config
      # or prettier version moves; a broad `prettier --write` then surfaces 100+
      # stray reformats that read as churn. This keeps main formatted so that can't
      # happen. `.prettierignore` excludes generated/data (mobile native, gold-cases).
      - name: Format check (Prettier drift gate)
        run: pnpm format:check

      - name: Dead code check (knip)
        run: pnpm lint:dead-code

  # ── Type Check ────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_app == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo Cache
        uses: dtinth/setup-github-actions-caching-for-turbo@v1

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Type check all apps (parallel)
        run: |
          FAIL=0
          if [[ "${{ needs.detect-changes.outputs.api }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter api exec tsc --noEmit --project tsconfig.build.json &
            PID_API=$!
          fi
          if [[ "${{ needs.detect-changes.outputs.web }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter web exec tsc --noEmit &
            PID_WEB=$!
          fi
          if [[ "${{ needs.detect-changes.outputs.mobile }}" == "true" || "${{ needs.detect-changes.outputs.ci }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            pnpm --filter study-abroad-mobile exec tsc --noEmit &
            PID_MOBILE=$!
          fi
          [ -n "${PID_API:-}" ] && { wait $PID_API || FAIL=1; }
          [ -n "${PID_WEB:-}" ] && { wait $PID_WEB || FAIL=1; }
          [ -n "${PID_MOBILE:-}" ] && { wait $PID_MOBILE || FAIL=1; }
          exit $FAIL

  # ── Unit Tests ────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_app == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo Cache
        uses: dtinth/setup-github-actions-caching-for-turbo@v1

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Run AI Eval (Fixtures)
        if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
        run: pnpm exec tsx scripts/eval/run-eval.ts --mode=fixtures --verbose

      - name: Run API tests
        if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
        run: pnpm --filter api exec jest --coverage --forceExit

      - name: Upload API coverage
        if: needs.detect-changes.outputs.api == 'true' || github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/api/coverage/lcov.info
          flags: api
          fail_ci_if_error: false

      - name: Run Web tests
        if: needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
        run: pnpm --filter web test

      - name: Run Mobile tests
        if: needs.detect-changes.outputs.mobile == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
        # `exec jest` (not `test -- …`) so jest receives the flags instead of reading
        # them as a test-path pattern; `--filter mobile` matched no project (the package
        # is `study-abroad-mobile`), so this step had been a silent no-op in CI.
        run: pnpm --filter study-abroad-mobile exec jest --forceExit

  # ── E2E Tests ─────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: studyabroad_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Create shadow database for drift check
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE studyabroad_shadow;"

      - name: Check migration drift
        run: pnpm --filter api exec prisma migrate diff --from-migrations ./prisma/migrations --to-schema-datamodel ./prisma/schema.prisma --shadow-database-url postgresql://postgres:postgres@localhost:5432/studyabroad_shadow --exit-code
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_test?schema=public

      - name: Check migration safety
        run: |
          if [ -f scripts/check-migration-safety.ts ]; then
            pnpm exec tsx scripts/check-migration-safety.ts
          fi

      - name: Enable pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d studyabroad_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Apply migrations to database
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_test?schema=public

      - name: Build shared package
        run: pnpm --filter @study-abroad/shared build

      - name: Seed database
        run: pnpm --filter api exec prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_test?schema=public

      - name: Verify school facts
        run: pnpm --filter api verify:school-facts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_test?schema=public
          JWT_SECRET: test-secret-key-for-ci-e2e-testing
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d

      - name: Run E2E tests
        run: pnpm --filter api exec jest --config ./test/jest-e2e.json --forceExit
        timeout-minutes: 15
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-e2e-testing
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d

  # ── Web E2E (Playwright) ──────────────────────────────────
  e2e-web:
    name: Web E2E Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4101

      - name: Run Playwright smoke tests
        run: pnpm exec playwright test e2e/core-pages.spec.ts --reporter=list
        timeout-minutes: 10
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e-report/
          retention-days: 7

  release-runtime:
    name: Web Release Runtime Gate
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: studyabroad_release_runtime
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Enable pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d studyabroad_release_runtime -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_release_runtime?schema=public

      # First build of shared package: the prisma seed script imports from
      # @study-abroad/shared/dist/utils via require() (CJS resolution), so dist/
      # must exist before `prisma db seed`. Mirrors the e2e / gold-fixtures jobs.
      - name: Build shared package (initial — for seed script)
        run: pnpm --filter @study-abroad/shared build

      - name: Seed database
        # Base seed (schools + demo@example.com + admin@example.com) then the
        # full demo seed, which creates the audit's applicant user
        # alice.zhang@demo.studyabroad.com (VERIFIED, onboardingCompleted) with
        # rich profile/essay/prediction data. Without db:seed:demo the audit's
        # applicant login 401s and every protected route fails the gate.
        run: |
          pnpm --filter api exec prisma db seed
          pnpm --filter api db:seed:demo
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_release_runtime?schema=public

      - name: Build API and Web
        run: |
          pnpm --filter api build
          NEXT_PUBLIC_API_URL=http://localhost:4101 pnpm --filter web build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_release_runtime?schema=public

      - name: Start local production services
        run: |
          pnpm --filter api start:prod > /tmp/release-runtime-api.log 2>&1 &
          pnpm --filter web start > /tmp/release-runtime-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4101/health >/dev/null 2>&1 && curl -fsS http://localhost:4100 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "API log:"
          cat /tmp/release-runtime-api.log || true
          echo "Web log:"
          cat /tmp/release-runtime-web.log || true
          exit 1
        env:
          NODE_ENV: production
          PORT: 4101
          NEXT_PUBLIC_API_URL: http://localhost:4101
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_release_runtime?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-e2e-testing
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          # NODE_ENV=production triggers env.validation's prod-required checks
          # (VAULT_ENCRYPTION_KEY / CORS_ORIGINS / FRONTEND_URL) — supply test
          # values so `api start:prod` boots. Cookies get Secure:true in prod,
          # but the audit re-adds them to the browser as secure:false, so http
          # localhost auth still works.
          VAULT_ENCRYPTION_KEY: test-only-vault-encryption-key-release-runtime-do-not-use
          CORS_ORIGINS: http://localhost:4100
          FRONTEND_URL: http://localhost:4100
          # Disable rate limiting for the audit only: one session drives all 81
          # routes and would otherwise self-throttle (429) on shared/layout
          # endpoints. Prod never sets this, so throttling stays active there.
          THROTTLE_DISABLED: 'true'

      # Root public assets must bypass the locale proxy. When the matcher
      # intercepted them, /sw.js 307-redirected and browsers reject redirected
      # service-worker scripts — every installed SW got pinned forever with a
      # stale precache (the 2026-06 "页面无法跳转" incident); redirected
      # robots/sitemap also hid the site from crawlers. Pairs with
      # apps/web/src/proxy.matcher.test.ts (unit level).
      - name: Assert root public assets bypass proxy (sw.js / robots / sitemap)
        run: |
          set -e
          for p in /sw.js /manifest.json /robots.txt /sitemap.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:4100$p")
            if [ "$code" != "200" ]; then
              echo "❌ $p -> HTTP $code (expected 200 — proxy matcher is intercepting it again)"
              exit 1
            fi
          done
          ct=$(curl -s -o /dev/null -w "%{content_type}" http://localhost:4100/sw.js)
          case "$ct" in
            *javascript*) echo "✅ sw.js + manifest + robots + sitemap all 200; sw.js is $ct" ;;
            *) echo "❌ /sw.js content-type '$ct' (expected javascript — likely an HTML 404/redirect body)"; exit 1 ;;
          esac

      - name: Run release runtime audit
        run: pnpm full-surface:run -- --mode=release-runtime --environment=local --web-base=http://localhost:4100 --api-base=http://localhost:4101/api/v1 --force-rerun
        env:
          CI: true

      - name: Gate release runtime evidence
        run: pnpm lint:release-runtime -- --environment=local --max-age-hours=2

      - name: Upload release runtime evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-runtime-evidence
          path: e2e-report/release-runtime-*/
          retention-days: 14

  application-analysis-governance:
    name: Application Analysis Governance
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.mobile == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: studyabroad_application_analysis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Enable pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d studyabroad_application_analysis -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Apply migrations to database
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_application_analysis?schema=public

      # First build of shared package: needed by prisma seed script which imports
      # from @study-abroad/shared/dist/utils via require() (CJS resolution).
      - name: Build shared package (initial — for seed script)
        run: pnpm --filter @study-abroad/shared build

      # Seed DB BEFORE gold:fixtures so runSnapshot can look up testingPolicy
      # (and other school fields) from real seeded School rows. If DB is empty
      # the analysis service defaults every policy to UNKNOWN, leaving the
      # regenerated fixture file with no real BLIND/OPTIONAL/REQUIRED data.
      - name: Seed database
        run: pnpm --filter api exec prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_application_analysis?schema=public

      - name: Seed governance fixtures
        run: pnpm --filter api exec ts-node --transpile-only scripts/seed-application-analysis-governance.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_application_analysis?schema=public

      - name: Generate render fixtures
        run: pnpm --filter api gold:fixtures
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_application_analysis?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-e2e-testing
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d

      # Re-build shared AFTER gold:fixtures so the dist/ output includes the
      # regenerated fixture data. Otherwise Next.js (web app) resolves
      # @study-abroad/shared to the fresh .ts source via package.json `import`
      # field while Playwright's raw-Node ESM loader can't read .ts and falls
      # back to the stale dist/*.js — both sides see different fixture data
      # and the data-policy DOM comparison fails (Expected BLIND from dist
      # vs Received UNKNOWN from source).
      - name: Re-build shared package (after fixture regen)
        run: pnpm --filter @study-abroad/shared build

      - name: Run governance gate
        run: pnpm application-analysis:governance -- --mode=pr
        env:
          CI: true
          ENABLE_E2E_FIXTURES: true
          NEXT_PUBLIC_API_URL: http://localhost:4101
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_application_analysis?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-e2e-testing
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d

      - name: Upload governance artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: application-analysis-governance
          path: |
            apps/api/gold-cases/reports/
            e2e-report/
          retention-days: 7

  prediction-gate:
    name: Prediction Gate
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'push'
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: studyabroad_prediction_gate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Enable pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d studyabroad_prediction_gate -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Apply migrations to prediction gate database
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      - name: Build shared package
        run: pnpm --filter @study-abroad/shared build

      - name: Build API
        run: pnpm --filter api build

      - name: Seed prediction gate database
        run: pnpm --filter api exec prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      # Closure-v2 prediction-input overlay. Mirrors migrate.sh step 1 in prod:
      # applies prediction-closure-latest.json (regenerated from prod via
      # build-prediction-closure-payload.ts) on top of the static catalog so
      # closure corrections (acceptanceRate, gpaDistribution, hasEarlyAction,
      # hasEarlyDecision2, etc.) actually reach CI. Without this step, every
      # closure correction silently diverges between prod and CI and Layer 3
      # regression fixtures flip pass/fail along the drift.
      - name: Apply prediction-closure overlay
        working-directory: apps/api
        run: pnpm exec tsx prisma/seeds/seed-prediction-closure.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      # Backfill hasEarlyAction / hasEarlyDecision2 booleans. Mirrors
      # migrate.sh step 15 — these columns were added in PR #295 but the
      # closure payload only carries them for schools that explicitly recorded
      # a value, so the static fallback list is still needed for full coverage.
      - name: Backfill EA / ED2 booleans
        working-directory: apps/api
        run: pnpm exec tsx prisma/seeds/backfill-has-ea-ed2.ts --apply
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      # Data-integrity corrections. MUST run after the closure overlay (which
      # re-applies raw values), mirroring migrate.sh's last steps, so the gate DB
      # matches prod and the audit below verifies the whole pipeline stayed clean.
      #   • intl/round — null only SCALE errors (intl <1% / >100%, early-round
      #     <1%). Intl >= overall is KEPT (verified real revenue-public rates), so
      #     calibration is unaffected.
      #   • audit/instate — set REAL verified rates: the audit anchors (e.g. CU
      #     Boulder 18.47%→80.5%) and per-school inStateAcceptanceRate. These run
      #     inside seed.ts too, but the overlay above RE-OVERRIDES them with raw
      #     payload values, so they MUST be re-applied here to win — exactly as
      #     migrate.sh step 17 does in prod. Order mirrors seed.ts
      #     (intl→round→audit→instate).
      - name: Apply data-integrity corrections
        working-directory: apps/api
        run: |
          pnpm exec tsx prisma/seed-intl-rate-correction.ts
          pnpm exec tsx prisma/seed-round-rate-correction.ts
          pnpm exec tsx prisma/seed-audit-corrections-2026-05-31.ts
          pnpm exec tsx prisma/seed-instate-rate-2026-05-31.ts
          pnpm exec tsx prisma/seed-testing-policy-2026-07-25.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      # Property sweep over the full seeded population: monotonicity, dominance,
      # round ordering, hook direction, determinism, clamp bounds. It is the only
      # instrument that catches "a change pushed predictions too high" — gold and
      # calibration cases pin specific points, this pins the shape.
      #
      # Tier-1 CDS admit bands. This job used to skip them, so the gate DB had
      # zero cdsAdmitBands while prod loads them at migrate.sh step 54 — the
      # whole Tier-1 anchor path went unexercised here. Seeding them closes that
      # gap and is what lets the sweep below actually cover it.
      - name: Load CDS admit bands
        working-directory: apps/api
        run: pnpm exec tsx prisma/seeds/load-cds-bands.ts --file prisma/seeds/data/cds-admit-bands.json --apply
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      # Property sweep over the full seeded population: monotonicity, dominance,
      # round ordering, hook direction, determinism, clamp bounds. It is the only
      # instrument that catches "a change pushed predictions too high" — gold and
      # calibration cases pin specific points, this pins the shape.
      #
      # It was excluded for years on the grounds that a partially-seeded gate DB
      # produces tier-crossing artifacts. That was true, and the cause was not
      # the gate: prisma/seeds/data/cds-admit-bands.json was merging a starter
      # FIXTURE that gave UC Merced only a `3.75-4.00` rung, so a 4.0 anchored
      # at 0.88 while a 3.5 fell through to Tier-2 and anchored at ~0.89. Prod
      # loaded that same file. Fixture removed 2026-07-25; measured on a
      # faithful reproduction of this job's DB, with bands loaded: 241 schools,
      # 9,342 checks, 0 violations, all 16 invariants green.
      - name: Counselor invariant sweep
        run: pnpm --filter api invariants:counselor
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      - name: Verify prediction launch reports
        run: |
          pnpm --filter api verify:counselor-coverage
          pnpm --filter api verify:counselor-data-quality
          pnpm --filter api verify:prediction-launch
          pnpm --filter api verify:profile-signal-coverage
          pnpm --filter api audit:counselor-vs-cases
          pnpm --filter api audit:prediction-data-integrity
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-prediction-gate
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci-prediction-gate
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d

      - name: Upload prediction launch reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prediction-launch-reports
          path: |
            verification-report/launch/
            verification-report/profile-signals/
          retention-days: 14

      - name: Start API server
        run: |
          pnpm --filter api start:prod > /tmp/prediction-gate-api.log 2>&1 &
          echo $! > /tmp/prediction-gate-api.pid
        env:
          NODE_ENV: test
          PORT: 4101
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-prediction-gate
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci-prediction-gate
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d

      - name: Wait for API readiness
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:4101/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/prediction-gate-api.log || true
          exit 1

      - name: Run counselor gold cases
        # Cold-start counselor engine regression gate (PR-3). Loads 30 hand-curated
        # (profile, school, expectedRange) cases from apps/api/gold-cases/counselor/
        # and asserts no counselor prediction drifts outside its expected band.
        # Runs BEFORE the existing accuracy/smoke check so a math regression in
        # the modifiers fails fast, before the heavier seeded HTTP smoke.
        working-directory: apps/api
        run: pnpm gold:counselor
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      - name: Upload counselor gold case report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: counselor-gold-case-report
          path: apps/api/gold-cases/counselor/reports/
          retention-days: 14

      - name: Run counselor calibration spec (Layer 3)
        # Industry-anchored calibration check. Each fixture has an expected
        # probability band derived from NACAC / Crimson / CDS (NOT from current
        # engine math). Fails fast if the engine drifts away from industry
        # intuition. See docs/PREDICTION_CALIBRATION_METHODOLOGY.md.
        working-directory: apps/api
        run: pnpm calibration:counselor
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      - name: Upload counselor calibration spec report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: counselor-calibration-spec-report
          path: apps/api/gold-cases/counselor-calibration/reports/
          retention-days: 14

      # NOTE: the counselor invariant sweep (`pnpm invariants:counselor`) is intentionally
      # NOT gated here. It is a full-POPULATION property sweep and is only meaningful on a
      # prod-representative dataset (complete CDS band ladders + gpaDistribution). This gate
      # DB is seeded via `prisma db seed` (minimal/partial: no full bands), which produces
      # tier-crossing artifacts (a 3.8 matching a lone low Tier-1 band scores below a 3.5 on
      # the Tier-2 overall) that do NOT exist on the orchestrator-seeded prod path. Run it
      # LOCALLY against `pnpm --filter api db:seed` instead — see the script header and
      # docs/PREDICTION_INVARIANT_DEEPDIVE_2026-06-01.md.

      - name: Run prediction gate
        run: pnpm exec tsx scripts/prediction-gate.ts --days 365 --min-verified 200 --school-query Wisconsin --round EA --base-url http://localhost:4101/api/v1
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyabroad_prediction_gate?schema=public

      - name: Upload prediction gate API log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prediction-gate-api-log
          path: /tmp/prediction-gate-api.log
          retention-days: 7

      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/prediction-gate-api.pid ]; then
            kill "$(cat /tmp/prediction-gate-api.pid)" || true
          fi

  # ── Documentation Check ───────────────────────────────────
  doc-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check API docs sync
        run: |
          CHANGED_CONTROLLERS=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- 'apps/api/src/modules/**/*.controller.ts' | wc -l | tr -d ' ')
          if [ "$CHANGED_CONTROLLERS" -gt "0" ]; then
            API_DOC_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- 'docs/API_REFERENCE.md' | wc -l | tr -d ' ')
            if [ "$API_DOC_CHANGED" -eq "0" ]; then
              echo "::warning::Controller files were modified but docs/API_REFERENCE.md was not updated. Please verify the API reference is still accurate."
            fi
          fi

      - name: Check schema docs sync
        run: |
          SCHEMA_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- 'apps/api/prisma/schema.prisma' | wc -l | tr -d ' ')
          if [ "$SCHEMA_CHANGED" -gt "0" ]; then
            ARCH_DOC_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- 'docs/ARCHITECTURE.md' | wc -l | tr -d ' ')
            if [ "$ARCH_DOC_CHANGED" -eq "0" ]; then
              echo "::warning::Schema was modified but docs/ARCHITECTURE.md was not updated. Please verify the architecture doc is still accurate."
            fi
          fi

      - name: Verify doc links
        run: |
          BROKEN=0
          for file in docs/*.md; do
            while IFS= read -r line; do
              link=$(echo "$line" | grep -oP '\]\(\K[^)]+' | head -1)
              if [ -n "$link" ] && [[ ! "$link" =~ ^http ]] && [[ ! "$link" =~ ^# ]] && [[ ! "$link" =~ ^mailto ]]; then
                dir=$(dirname "$file")
                resolved="$dir/$link"
                if [ ! -e "$resolved" ]; then
                  echo "::warning file=$file::Broken link: $link"
                  BROKEN=$((BROKEN + 1))
                fi
              fi
            done < <(grep -n '\](' "$file" || true)
          done
          if [ "$BROKEN" -gt "0" ]; then
            echo "::warning::Found $BROKEN potentially broken documentation links"
          fi

  # ── Secret Scan ───────────────────────────────────────────
  # Uses the OSS gitleaks binary directly (rather than gitleaks-action@v2)
  # because the official action now requires a paid license for org repos
  # ("🛑 missing gitleaks license. Go grab one at gitleaks.io"). The binary
  # itself remains free under MIT; we just need to run it ourselves.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (OSS)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repo for secrets
        # `--redact` masks any matched secret value in the log so the report
        # itself can't leak. Non-zero exit means findings present → CI fails.
        run: gitleaks detect --source . --redact --verbose --no-banner

  # ── SAST Scan ─────────────────────────────────────────────
  sast:
    name: SAST Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/typescript
            p/nodejs
            p/owasp-top-ten
          generateSarif: '1'

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

  # ── Security Scan ─────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          skip-dirs: 'node_modules,.next,dist,coverage'

  # ── Build ─────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo Cache
        uses: dtinth/setup-github-actions-caching-for-turbo@v1

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Build API
        run: pnpm --filter api build

      - name: Build Web
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL || 'http://localhost:4101' }}

      # 2026-05 Phase 4 #37: bundle-size budget gate.
      # Compares post-build app-build-manifest.json against the committed
      # baseline at apps/web/.bundle-baseline.json. Fails when any route
      # grows by more than thresholdPct (default 5%).
      # Until the baseline is seeded, runs in informational mode (prints
      # top-10 route sizes, never fails).
      - name: Bundle size budget
        run: pnpm lint:bundle

      - name: Type check Mobile
        run: pnpm --filter study-abroad-mobile exec tsc --noEmit

      - name: Upload API build
        uses: actions/upload-artifact@v7
        with:
          name: api-build
          path: apps/api/dist
          retention-days: 7

      - name: Upload Web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 7

  # ── Docker Build ──────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          # ignore-error: a transient GHA cache-export hiccup ("error writing layer
          # blob: not_found") must not red the build — the image still builds, pushes,
          # and gets Trivy-scanned. Keeps mode=max cache reuse; only export failures
          # become non-fatal (observed flaking the job on run 27487900061, needing a
          # manual re-run — make the gate trustworthy rather than rely on re-runs).
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

  # ── SBOM Generation ───────────────────────────────────────
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          npx @cyclonedx/cdxgen -o sbom/bom.json --deep -t js --spec-version 1.5

      - name: Verify SBOM
        run: pnpm sbom:verify

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom/bom.json
          retention-days: 90

  # ── Deploy to GCP ─────────────────────────────────────────
  deploy-gcp:
    name: Deploy to GCP
    runs-on: ubuntu-latest
    needs: [build, e2e, security]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-deploy@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Save previous revision for rollback
        id: prev
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          PREV=$(gcloud run revisions list --service=study-abroad-api --region=$REGION --format='value(REVISION)' --limit=1 2>/dev/null || echo "")
          echo "revision=$PREV" >> $GITHUB_OUTPUT

      - name: Build and push image
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          SHA="${GITHUB_SHA::7}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/study-abroad/api"
          docker build -f apps/api/Dockerfile -t "${IMAGE}:${SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:latest"
          echo "IMAGE=${IMAGE}:${SHA}" >> $GITHUB_ENV

      - name: Run database migrations
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          SHA="${GITHUB_SHA::7}"
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/study-abroad/api:${SHA}"

          JOB_ARGS=(
            --image="$IMAGE"
            --region="$REGION"
            --vpc-connector=projects/${{ secrets.GCP_PROJECT_ID }}/locations/$REGION/connectors/study-abroad-connector
            --vpc-egress=private-ranges-only
            --task-timeout=300
            --max-retries=0
            --command="./migrate.sh"
            --set-secrets="DATABASE_URL=database-url:latest"
            --quiet
          )

          if gcloud run jobs describe study-abroad-migrate --region="$REGION" --quiet >/dev/null 2>&1; then
            # Clear any previously set env var to avoid conflict with secret reference
            gcloud run jobs update study-abroad-migrate \
              --region="$REGION" \
              --remove-env-vars=DATABASE_URL \
              --quiet 2>/dev/null || true
            gcloud run jobs update study-abroad-migrate "${JOB_ARGS[@]}"
          else
            gcloud run jobs create study-abroad-migrate "${JOB_ARGS[@]}"
          fi

          # Capture execution name so we can pull its logs in the next step.
          EXEC_NAME=$(gcloud run jobs execute study-abroad-migrate \
            --region="$REGION" \
            --wait \
            --format='value(metadata.name)' \
            2>&1 | tee /tmp/migrate-exec.log | tail -n1)
          echo "exec_name=$EXEC_NAME" >> $GITHUB_ENV
          cat /tmp/migrate-exec.log

      - name: Try gcloud alpha/beta run jobs executions logs read
        if: always()
        continue-on-error: true
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          EXEC="${exec_name}"
          echo "=== try alpha ==="
          gcloud alpha run jobs executions logs read "${EXEC}" --region="$REGION" 2>&1 | head -200 || true
          echo "=== try beta ==="
          gcloud beta run jobs executions logs read "${EXEC}" --region="$REGION" 2>&1 | head -200 || true
          echo "=== try main ==="
          gcloud run jobs executions logs read "${EXEC}" --region="$REGION" 2>&1 | head -200 || true
          echo "=== end ==="

      - name: Compare migrate DATABASE_URL host with API DATABASE_URL host
        if: always()
        run: |
          # The migrate-job uses `database-url:latest` while the API service
          # uses `database-url-proxy:latest`. Sanity-check they point at the
          # same Cloud SQL instance — if not, the migrate is writing to a
          # different DB entirely, which would perfectly explain why prod
          # gallery shows 5 essays despite `migrate.sh` succeeding.
          set +e
          MIGRATE_URL=$(gcloud secrets versions access latest --secret=database-url 2>/dev/null)
          API_URL=$(gcloud secrets versions access latest --secret=database-url-proxy 2>/dev/null)
          set -e

          # Strip credentials so we never log them; keep host + db name only.
          sanitize() {
            # postgresql://user:pass@host:port/db?... → host:port/db
            printf '%s' "$1" | sed -E 's#postgresql://[^@]+@([^?]+).*#\1#'
          }
          M_HOST=$(sanitize "$MIGRATE_URL")
          A_HOST=$(sanitize "$API_URL")
          echo "migrate host/db: ${M_HOST:-<empty>}"
          echo "api host/db    : ${A_HOST:-<empty>}"
          # Strip the path/host part for direct comparison ignoring port differences
          # since proxy uses a unix socket and direct uses an IP.
          # We compare just the database name (last path segment before ?).
          db_name() { printf '%s' "$1" | sed -E 's#.*/([^/?]+)([?].*)?$#\1#'; }
          M_DB=$(db_name "$M_HOST")
          A_DB=$(db_name "$A_HOST")
          echo "migrate DB name: ${M_DB:-<empty>}"
          echo "api DB name    : ${A_DB:-<empty>}"
          if [ "$M_DB" != "$A_DB" ] && [ -n "$M_DB" ] && [ -n "$A_DB" ]; then
            echo "::error::Migrate job and API service connect to DIFFERENT databases: '$M_DB' vs '$A_DB'"
          else
            echo "✓ Same DB name on both sides."
          fi

      - name: Deploy canary (no traffic)
        if: success()
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          SHA="${GITHUB_SHA::7}"
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/study-abroad/api:${SHA}"
          gcloud run deploy study-abroad-api \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --max-instances=3 \
            --min-instances=0 \
            --cpu-throttling \
            --session-affinity \
            --vpc-connector=projects/${{ secrets.GCP_PROJECT_ID }}/locations/$REGION/connectors/study-abroad-connector \
            --vpc-egress=private-ranges-only \
            --add-cloudsql-instances=${{ secrets.GCP_CLOUDSQL_INSTANCE }} \
            --set-env-vars="^|^NODE_ENV=production|FRONTEND_URL=https://www.lumniedu.com|CORS_ORIGINS=https://study-abroad-platform-web.vercel.app,https://www.lumniedu.com,https://lumniedu.com|OPENAI_MODEL=deepseek-v4-pro|OPENAI_BASE_URL=https://xh.v1api.cc/v1|EMAIL_FROM=noreply@lumniedu.com|EMAIL_FROM_NAME=Lumni" \
            --set-secrets="DATABASE_URL=database-url-proxy:latest,JWT_SECRET=jwt-secret:latest,JWT_REFRESH_SECRET=jwt-refresh-secret:latest,VAULT_ENCRYPTION_KEY=vault-encryption-key:latest,OPENAI_API_KEY=openai-api-key:latest,REDIS_URL=redis-url:latest,RESEND_API_KEY=resend-api-key:latest,TAVILY_API_KEY=tavily-api-key:latest" \
            --timeout=300 \
            --no-traffic \
            --tag=canary \
            --quiet

      - name: Canary smoke test
        id: canary-smoke
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          CANARY_URL=""
          for i in 1 2 3 4 5; do
            SERVICE_JSON=$(gcloud run services describe study-abroad-api --region="$REGION" --format=json 2>/dev/null || echo '{}')
            CANARY_URL=$(printf '%s' "$SERVICE_JSON" | node scripts/ci/cloud-run-canary-url.mjs --tag canary 2>/dev/null || true)
            if [ -n "$CANARY_URL" ]; then
              break
            fi
            echo "⏳ Canary URL not ready (attempt $i)"
            sleep 5
          done
          if [ -z "$CANARY_URL" ]; then
            echo "::error::Could not get canary URL for Cloud Run tag 'canary'"
            exit 1
          fi
          echo "canary_url=$CANARY_URL" >> $GITHUB_OUTPUT
          sleep 5
          for i in 1 2 3; do
            RESPONSE=$(curl -s "$CANARY_URL/health" --max-time 15 || echo '{}')
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$CANARY_URL/health" --max-time 15 || true)
            STATUS="${STATUS:-000}"
            if printf '%s' "$RESPONSE" | node scripts/ci/validate-deploy-health.mjs --http-status "$STATUS" --label "Canary"; then
              exit 0
            fi
            echo "⏳ Canary check attempt $i did not meet deploy-critical health"
            sleep 5
          done
          echo "::error::Canary health check failed"
          exit 1

      - name: Promote canary to full traffic
        if: success()
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          gcloud run services update-traffic study-abroad-api \
            --region="$REGION" \
            --to-latest \
            --quiet

      - name: Smoke test
        id: smoke
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          URL=$(gcloud run services describe study-abroad-api --region=$REGION --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

          # Wait for new revision to stabilize
          sleep 10

          # Health check with retries (validate response body, not just HTTP 200)
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s "$URL/health" --max-time 15 || echo '{}')
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health" --max-time 15 || true)
            STATUS="${STATUS:-000}"
            if printf '%s' "$RESPONSE" | node scripts/ci/validate-deploy-health.mjs --http-status "$STATUS" --label "Post-promote"; then
              echo "::notice title=API deployed::Cloud Run URL: $URL"
              exit 0
            fi
            echo "⏳ Health check attempt $i did not meet deploy-critical health"
            sleep 5
          done
          echo "::error::Health check failed after 5 attempts"
          exit 1

      - name: Probe prod essay gallery count
        if: always()
        continue-on-error: true
        run: |
          # Direct user-visible signal: how many essays did the migrate
          # actually load? Hits the public, no-auth endpoint with the
          # full v1 prefix (gallery returns total in response.data.total).
          URL="https://www.lumniedu.com/api/v1/essay-ai/gallery?page=1&pageSize=1"
          RESPONSE=$(curl -fsS "$URL" --max-time 15 || echo '{"data":{"total":-1}}')
          TOTAL=$(printf '%s' "$RESPONSE" | node -e "
            let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
              try{console.log(JSON.parse(s).data.total)}catch(e){console.log('parse_error')}
            });
          ")
          echo "Prod gallery total = ${TOTAL}"
          if [ "$TOTAL" -lt 150 ] 2>/dev/null; then
            echo "::warning::Essay gallery total is ${TOTAL} (expected >= 150)"
          else
            echo "✓ Essay gallery total is ${TOTAL} (>= 150)"
          fi

      - name: Rollback on failure
        if: failure() && steps.prev.outputs.revision != ''
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          PREV="${{ steps.prev.outputs.revision }}"
          echo "::warning::Rolling back to previous revision: $PREV"
          gcloud run services update-traffic study-abroad-api \
            --region="$REGION" \
            --to-revisions="$PREV=100" \
            --quiet || echo "Rollback failed — manual intervention required"
