# Auto-deploy develop branch to staging Cloud Run service
# Uses same GCP infrastructure as production but with reduced resources
name: Deploy Staging

on:
  push:
    branches: [develop]

jobs:
  deploy-staging:
    name: Build and Deploy Staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-deploy@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          SHA="${GITHUB_SHA::7}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/study-abroad/api"
          docker build -f apps/api/Dockerfile -t "${IMAGE}:staging-${SHA}" .
          docker push "${IMAGE}:staging-${SHA}"
          echo "IMAGE=${IMAGE}:staging-${SHA}" >> $GITHUB_ENV

      - name: Run database migrations
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          IMAGE="${{ env.IMAGE }}"

          # TODO: Create staging-specific secret `database-url-staging:latest` in GCP Secret Manager
          # For now, uses the same migration job pattern as production
          JOB_ARGS=(
            --image="$IMAGE"
            --region="$REGION"
            --vpc-connector=projects/${{ secrets.GCP_PROJECT_ID }}/locations/$REGION/connectors/study-abroad-connector
            --vpc-egress=private-ranges-only
            --task-timeout=300
            --max-retries=0
            --command="./migrate.sh"
            --set-secrets="DATABASE_URL=database-url-staging:latest"
            --quiet
          )

          if gcloud run jobs describe study-abroad-migrate-staging --region="$REGION" --quiet >/dev/null 2>&1; then
            gcloud run jobs update study-abroad-migrate-staging \
              --region="$REGION" \
              --remove-env-vars=DATABASE_URL \
              --quiet 2>/dev/null || true
            gcloud run jobs update study-abroad-migrate-staging "${JOB_ARGS[@]}"
          else
            gcloud run jobs create study-abroad-migrate-staging "${JOB_ARGS[@]}"
          fi

          gcloud run jobs execute study-abroad-migrate-staging \
            --region="$REGION" \
            --wait \
            --quiet

      - name: Deploy to Cloud Run
        if: success()
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          IMAGE="${{ env.IMAGE }}"
          # TODO: Update FRONTEND_URL and CORS_ORIGINS to staging web URL when available
          gcloud run deploy study-abroad-api-staging \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --max-instances=1 \
            --min-instances=0 \
            --cpu-throttling \
            --vpc-connector=projects/${{ secrets.GCP_PROJECT_ID }}/locations/$REGION/connectors/study-abroad-connector \
            --vpc-egress=private-ranges-only \
            --add-cloudsql-instances=${{ secrets.GCP_CLOUDSQL_INSTANCE }} \
            --set-env-vars="NODE_ENV=staging,FRONTEND_URL=https://staging.study-abroad-platform-web.vercel.app,CORS_ORIGINS=https://staging.study-abroad-platform-web.vercel.app,OPENAI_MODEL=deepseek-v4-pro,OPENAI_BASE_URL=https://xh.v1api.cc/v1" \
            --set-secrets="DATABASE_URL=database-url-proxy-staging:latest,JWT_SECRET=jwt-secret:latest,JWT_REFRESH_SECRET=jwt-refresh-secret:latest,VAULT_ENCRYPTION_KEY=vault-encryption-key:latest,OPENAI_API_KEY=openai-api-key:latest,REDIS_URL=redis-url-staging:latest,RESEND_API_KEY=resend-api-key:latest,TAVILY_API_KEY=tavily-api-key:latest" \
            --timeout=300 \
            --quiet

      - name: Smoke test
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          URL=$(gcloud run services describe study-abroad-api-staging --region=$REGION --format='value(status.url)')
          sleep 10
          for i in 1 2 3; do
            RESPONSE=$(curl -s "$URL/health" --max-time 15 || echo '{"data":{"status":"unreachable"}}')
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health" --max-time 15 || echo "000")
            HEALTH_STATUS=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('data',{}).get('status','unknown'))" 2>/dev/null || echo "unknown")

            if [ "$HTTP_CODE" = "200" ] && [ "$HEALTH_STATUS" = "ok" -o "$HEALTH_STATUS" = "degraded" ]; then
              echo "✅ Staging health check passed (attempt $i): HTTP $HTTP_CODE, status=$HEALTH_STATUS"
              echo "::notice title=Staging deployed::Cloud Run URL: $URL"
              exit 0
            fi
            echo "⏳ Health check attempt $i: HTTP $HTTP_CODE, status=$HEALTH_STATUS"
            sleep 10
          done
          echo "::error::Staging health check failed after 3 attempts"
          exit 1
