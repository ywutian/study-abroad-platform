name: Mobile CI

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
  push:
    branches: [main, develop]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'

jobs:
  lint-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @study-abroad/shared build

      - name: Lint & TypeCheck & Test (parallel)
        run: |
          pnpm --filter study-abroad-mobile lint &
          PID_LINT=$!
          pnpm --filter study-abroad-mobile exec tsc --noEmit &
          PID_TSC=$!
          # `--runInBand` matches apps/mobile test scripts and ci.yml; keep in sync.
          pnpm --filter study-abroad-mobile exec jest --runInBand --ci --coverage --forceExit &
          PID_TEST=$!
          wait $PID_LINT || exit 1
          wait $PID_TSC || exit 1
          wait $PID_TEST || exit 1

      - name: Validate Expo config
        run: npx expo-doctor@latest || true
        working-directory: apps/mobile

      - name: Verify JS bundle
        run: npx expo export --platform web --output-dir /tmp/expo-export
        working-directory: apps/mobile

      - name: Upload Coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          flags: mobile
          directory: apps/mobile/coverage
        continue-on-error: true
