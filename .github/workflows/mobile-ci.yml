name: Mobile CI

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
  push:
    branches: [main, develop]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'

jobs:
  lint-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: dtinth/setup-github-actions-caching-for-turbo@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @study-abroad/shared build

      - name: Lint & TypeCheck & Test (parallel)
        run: |
          pnpm --filter study-abroad-mobile lint &
          PID_LINT=$!
          pnpm --filter study-abroad-mobile exec tsc --noEmit &
          PID_TSC=$!
          pnpm --filter study-abroad-mobile exec jest --ci --coverage --forceExit &
          PID_TEST=$!
          wait $PID_LINT || exit 1
          wait $PID_TSC || exit 1
          wait $PID_TEST || exit 1

      - name: Validate Expo config
        run: npx expo-doctor@latest || true
        working-directory: apps/mobile

      - name: Verify JS bundle
        run: npx expo export --platform web --output-dir /tmp/expo-export
        working-directory: apps/mobile

      - name: Dependency audit
        run: pnpm audit --audit-level=high --registry=https://registry.npmjs.org
        continue-on-error: true

      - name: Upload Coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          flags: mobile
          directory: apps/mobile/coverage
        continue-on-error: true
