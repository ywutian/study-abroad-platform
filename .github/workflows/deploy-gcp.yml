# 手动部署 API 到 GCP Cloud Run（自动部署已并入 CI workflow 的 Deploy to GCP job）
# 认证使用 Workload Identity Federation，无需服务账号密钥
# GitHub Secrets: GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_CLOUDSQL_INSTANCE
name: Deploy API to GCP

on:
  workflow_dispatch:

jobs:
  deploy-api-gcp:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-deploy@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Save previous revision for rollback
        id: prev
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          PREV=$(gcloud run revisions list --service=study-abroad-api --region=$REGION --format='value(REVISION)' --limit=1 2>/dev/null || echo "")
          echo "revision=$PREV" >> $GITHUB_OUTPUT

      - name: Build and push image
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          SHA="${GITHUB_SHA::7}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/study-abroad/api"
          docker build -f apps/api/Dockerfile -t "${IMAGE}:${SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:latest"
          echo "IMAGE=${IMAGE}:${SHA}" >> $GITHUB_ENV

      - name: Run database migrations
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          SHA="${GITHUB_SHA::7}"
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/study-abroad/api:${SHA}"

          # Create or update migration job
          JOB_ARGS=(
            --image="$IMAGE"
            --region="$REGION"
            --vpc-connector=projects/${{ secrets.GCP_PROJECT_ID }}/locations/$REGION/connectors/study-abroad-connector
            --vpc-egress=private-ranges-only
            --task-timeout=300
            --max-retries=0
            --command="./migrate.sh"
            --set-secrets="DATABASE_URL=database-url:latest"
            --quiet
          )

          if gcloud run jobs describe study-abroad-migrate --region="$REGION" --quiet >/dev/null 2>&1; then
            # Clear any previously set env var to avoid conflict with secret reference
            gcloud run jobs update study-abroad-migrate \
              --region="$REGION" \
              --remove-env-vars=DATABASE_URL \
              --quiet 2>/dev/null || true
            gcloud run jobs update study-abroad-migrate "${JOB_ARGS[@]}"
          else
            gcloud run jobs create study-abroad-migrate "${JOB_ARGS[@]}"
          fi

          # Execute migration and wait for completion
          gcloud run jobs execute study-abroad-migrate \
            --region="$REGION" \
            --wait \
            --quiet

      - name: Deploy to Cloud Run
        if: success()
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          SHA="${GITHUB_SHA::7}"
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/study-abroad/api:${SHA}"
          gcloud run deploy study-abroad-api \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --max-instances=3 \
            --min-instances=0 \
            --cpu-throttling \
            --vpc-connector=projects/${{ secrets.GCP_PROJECT_ID }}/locations/$REGION/connectors/study-abroad-connector \
            --vpc-egress=private-ranges-only \
            --add-cloudsql-instances=${{ secrets.GCP_CLOUDSQL_INSTANCE }} \
            --set-env-vars="NODE_ENV=production,FRONTEND_URL=https://study-abroad-platform-web.vercel.app,CORS_ORIGINS=https://study-abroad-platform-web.vercel.app,OPENAI_MODEL=gpt-4o-mini" \
            --set-secrets="DATABASE_URL=database-url-proxy:latest,JWT_SECRET=jwt-secret:latest,JWT_REFRESH_SECRET=jwt-refresh-secret:latest,VAULT_ENCRYPTION_KEY=vault-encryption-key:latest,OPENAI_API_KEY=openai-api-key:latest,REDIS_URL=redis-url:latest,RESEND_API_KEY=resend-api-key:latest,TAVILY_API_KEY=tavily-api-key:latest" \
            --timeout=300 \
            --quiet

      - name: Smoke test
        id: smoke
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          URL=$(gcloud run services describe study-abroad-api --region=$REGION --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
          sleep 15
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s "$URL/health" --max-time 15 || echo '{"data":{"status":"unreachable"}}')
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health" --max-time 15 || echo "000")
            HEALTH_STATUS=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('data',{}).get('status','unknown'))" 2>/dev/null || echo "unknown")

            if [ "$HTTP_CODE" = "200" ] && [ "$HEALTH_STATUS" = "ok" -o "$HEALTH_STATUS" = "degraded" ]; then
              echo "✅ Health check passed (attempt $i): HTTP $HTTP_CODE, status=$HEALTH_STATUS"
              echo "::notice title=API deployed::Cloud Run URL: $URL"
              exit 0
            fi
            echo "⏳ Health check attempt $i: HTTP $HTTP_CODE, status=$HEALTH_STATUS"
            sleep 10
          done
          echo "::error::Health check failed after 5 attempts"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.prev.outputs.revision != ''
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          PREV="${{ steps.prev.outputs.revision }}"
          echo "::warning::Rolling back to previous revision: $PREV"
          gcloud run services update-traffic study-abroad-api \
            --region="$REGION" \
            --to-revisions="$PREV=100" \
            --quiet || echo "Rollback failed — manual intervention required"

      - name: Cleanup old images
        if: success()
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/study-abroad/api"
          gcloud artifacts docker images list "$IMAGE" \
            --sort-by=~CREATE_TIME --format='value(VERSION)' \
            | tail -n +4 \
            | xargs -I {} gcloud artifacts docker images delete "${IMAGE}@{}" --quiet --delete-tags 2>/dev/null || true
