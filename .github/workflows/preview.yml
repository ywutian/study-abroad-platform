name: PR Preview Deploy

# Deploy a tagged Cloud Run revision for each PR that touches API/shared code.
# The tag creates an isolated URL (pr-{number}.service-url) with zero production traffic.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'prisma/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy-preview:
    # Requires: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_PROJECT_ID, GCP_REGION secrets.
    # Skip gracefully when GCP is not configured for the repo (e.g. forks, or
    # before first deploy) — use a repo variable that's visible to job-if.
    if: github.event_name == 'pull_request' && vars.PREVIEW_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account: github-actions-deploy@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          TAG="pr-${{ github.event.pull_request.number }}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/study-abroad/api"

          docker build \
            -f apps/api/Dockerfile \
            -t "${IMAGE}:${TAG}" \
            --build-arg GIT_COMMIT_SHA="${SHA}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

          docker push "${IMAGE}:${TAG}"

      - name: Deploy preview revision (no traffic)
        id: deploy
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          TAG="pr-${{ github.event.pull_request.number }}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/study-abroad/api:${TAG}"

          # Check if service exists; --no-traffic only works on existing services
          SERVICE_EXISTS=$(gcloud run services describe study-abroad-api-staging \
            --region="${REGION}" --format="value(status.url)" 2>/dev/null || echo "")

          if [ -n "$SERVICE_EXISTS" ]; then
            # Service exists: deploy as tagged revision with no traffic
            gcloud run deploy study-abroad-api-staging \
              --image="${IMAGE}" \
              --region="${REGION}" \
              --no-traffic \
              --tag="${TAG}" \
              --set-env-vars="NODE_ENV=staging,CRON_DRIVER=http" \
              --vpc-connector=projects/${PROJECT}/locations/${REGION}/connectors/study-abroad-connector \
              --quiet
          else
            # Service doesn't exist: create it (first deploy gets all traffic)
            gcloud run deploy study-abroad-api-staging \
              --image="${IMAGE}" \
              --region="${REGION}" \
              --tag="${TAG}" \
              --set-env-vars="NODE_ENV=staging,CRON_DRIVER=http" \
              --vpc-connector=projects/${PROJECT}/locations/${REGION}/connectors/study-abroad-connector \
              --allow-unauthenticated \
              --quiet
          fi

          # Get the preview URL from the tag
          PREVIEW_URL=$(gcloud run services describe study-abroad-api-staging \
            --region="${REGION}" \
            --format="value(status.traffic[tag=${TAG}].url)")

          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR with preview URL
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🚀 Preview Deployment

            | | |
            |---|---|
            | **URL** | ${{ steps.deploy.outputs.preview_url }} |
            | **Health** | ${{ steps.deploy.outputs.preview_url }}/health |
            | **Tag** | `${{ steps.deploy.outputs.tag }}` |
            | **Commit** | `${{ github.event.pull_request.head.sha }}` |

            > This preview uses the **staging** database and will be cleaned up when the PR is closed.

      - name: Verify preview health
        run: |
          PREVIEW_URL="${{ steps.deploy.outputs.preview_url }}"
          echo "Waiting for preview to become healthy..."
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${PREVIEW_URL}/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Preview is healthy!"
              exit 0
            fi
            echo "  Attempt $i: HTTP $STATUS — retrying in 5s..."
            sleep 5
          done
          echo "⚠️ Preview health check did not return 200 after 50s"
          exit 1
